<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./img/favicon.png" type="image/png">
    <title>Súper Entrenador ASIR - ISO, Marcas, Hardware y Redes</title>
    <style>
        :root {
            --primary: #6366F1; --primary-hover: #4F46E5; 
            --success: #10B981; --error: #EF4444; 
            --bg: #111827; --card: #1F2937; 
            --text: #F9FAFB; --text-muted: #9CA3AF; 
            --option-bg: #374151; --option-hover: #4B5563;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg); color: var(--text);
            margin: 0; padding: 40px 20px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start;
            box-sizing: border-box; overflow-y: auto; 
        }

        .container {
            background-color: var(--card); border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%; max-width: 900px; height: auto; min-height: 80vh;
            padding: 30px; box-sizing: border-box;
            display: flex; flex-direction: column;
            margin-bottom: 40px; 
        }

        h1, h2 { text-align: center; color: var(--primary); margin-top: 0; }
        p.subtitle { text-align: center; color: var(--text-muted); margin-bottom: 25px; flex-shrink: 0; }

        #subject-area, #blocks-area, #result-area { display: none; }
        .menu { display: flex; flex-direction: column; gap: 12px; }

        .btn {
            background-color: var(--primary); color: white; border: none;
            padding: 15px; border-radius: 8px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: background-color 0.2s;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-outline { background-color: transparent; color: var(--text); border: 2px solid var(--primary); }
        .btn-outline:hover { background-color: var(--primary); color: white; }
        .btn-back { background-color: #374151; margin-top: 20px; }
        .btn-back:hover { background-color: #4B5563; }

        #quiz-area { display: none; flex-direction: column; height: 100%; }

        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-shrink: 0; }
        .progress { font-size: 14px; color: var(--text-muted); font-weight: 600; }
        
        .score-board { display: flex; gap: 10px; }
        
        .live-score {
            font-size: 14px; font-weight: bold; color: var(--success);
            background-color: rgba(16, 185, 129, 0.1); padding: 6px 14px;
            border-radius: 20px; border: 1px solid var(--success);
        }
        
        .live-errors {
            font-size: 14px; font-weight: bold; color: var(--error);
            background-color: rgba(239, 68, 68, 0.1); padding: 6px 14px;
            border-radius: 20px; border: 1px solid var(--error);
        }

        .question { font-size: 19px; font-weight: 600; margin-bottom: 20px; flex-shrink: 0; line-height: 1.4; }
        
        .options { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
        .option {
            background-color: var(--option-bg); border: 2px solid transparent;
            padding: 12px 15px; border-radius: 8px; cursor: pointer;
            font-size: 16px; color: #FFFFFF; 
            transition: all 0.2s; line-height: 1.4; word-wrap: break-word;
        }
        .option:hover:not(.disabled) { background-color: var(--option-hover); }
        .option.disabled { cursor: not-allowed; opacity: 0.8; }
        
        .option.correct { background-color: #064E3B; border-color: var(--success); color: #A7F3D0; }
        .option.incorrect { background-color: #7F1D1D; border-color: var(--error); color: #FECACA; }

        .feedback {
            margin-top: 25px; padding: 20px; border-radius: 8px; font-size: 15px;
            display: none; line-height: 1.5;
        }
        .feedback.show { display: block; }
        
        .feedback-correct {
            background-color: #064E3B; border-left: 6px solid #10B981; color: #A7F3D0;
        }
        .feedback-incorrect {
            background-color: #7F1D1D; border-left: 6px solid #EF4444; color: #FECACA;
        }

        .feedback-header { font-size: 1.25em; font-weight: bold; margin-bottom: 8px; }
        .feedback-subtitle { margin-bottom: 15px; opacity: 0.9; }

        .feedback-list { margin-top: 15px; padding-left: 0; list-style: none; margin-bottom: 0; display: flex; flex-direction: column; gap: 10px; }
        .feedback-list li { padding: 15px; border-radius: 8px; background-color: rgba(0, 0, 0, 0.25); }
        
        .feedback-title { font-size: 1.05em; font-weight: bold; margin-bottom: 6px; color: #FFFFFF; }
        .feedback-desc { color: rgba(255, 255, 255, 0.85); font-size: 0.95em; }

        .nav-buttons { 
            display: flex; justify-content: space-between; margin-top: 25px; 
            padding-top: 20px; border-top: 1px solid #374151; gap: 10px; align-items: center;
        }
        .nav-controls { display: flex; gap: 10px; }
        .score-text { font-size: 20px; text-align: center; margin-bottom: 30px; line-height: 1.6; }

        /* Ocultar iconos en escritorio */
        .btn-icon {
            display: none;
        }


        /* Mostrar iconos y ocultar texto en móvil */
@media (max-width: 525px) {

    /* Ocultar texto en móvil */
    .btn-text {
        display: none !important;
    }

    /* Colocar todo en columna */
    .nav-buttons {
        flex-direction: column;
        align-items: center;
        gap: 18px;
    }

    /* Fila de iconos: ⟳ ❮ ❯ */
    .nav-controls {
        order: 1;
        display: flex;
        justify-content: center;
        gap: 18px;
    }

    /* Iconos centrados y grandes */
    .btn-icon {
        display: inline-flex !important;
        justify-content: center;
        align-items: center;
        font-size: 1.9rem;
        width: 54px;
        height: 54px;
        border-radius: 10px;
        background-color: var(--primary);
        color: white;
        border: none;
        padding: 0;
    }

    /* Reiniciar con outline (como querías) */
    #restart-icon {
        background-color: transparent;
        border: 2px solid var(--primary);
        color: var(--text);
    }

    /* Salir al menú debajo */
    #menu-btn {
        order: 2;
    }
}


            .footer {
                text-align: center;
                font-size: 0.85rem;
                color: #777;
                padding: 20px 0;
                margin-top: auto;
                width: 100%;
            }


    </style>
</head>
<body>

    <div class="container">
        <div id="subject-area" style="display: block;">
            <h1>Súper Entrenador ASIR</h1>
            <p class="subtitle">Selecciona la asignatura que quieres repasar hoy.</p>
            <div class="menu" id="subjects-container"></div>
        </div>

        <div id="blocks-area">
            <h1 id="subject-title">Asignatura</h1>
            <p class="subtitle">Selecciona un bloque temático para empezar el test.</p>
            <div class="menu" id="blocks-container"></div>
            <button class="btn btn-back" onclick="showSubjects()">← Volver a Asignaturas</button>
        </div>

        <div id="quiz-area">
            <div class="quiz-header">
                <div class="progress" id="progress-text"></div>
                <div class="score-board">
                    <div class="live-score" id="live-score">Aciertos: 0</div>
                    <div class="live-errors" id="live-errors">Fallos: 0</div>
                </div>
            </div>
            
            <div class="question" id="question-text"></div>
            <div class="options" id="options-container"></div>
            
            <div id="feedback-box" class="feedback"></div>
            
    <div class="nav-buttons">

    <!-- Botón salir al menú -->
    <button class="btn btn-outline" id="menu-btn" onclick="returnToBlocks()">Salir al Menú</button>

    <div class="nav-controls">

        <!-- Botones de texto (PC) -->
        <button class="btn btn-outline btn-text" id="restart-btn" onclick="restartBlock()" style="display: none;">Reiniciar</button>
        <button class="btn btn-outline btn-text" id="prev-btn" onclick="prevQuestion()" style="display: none;">Anterior</button>
        <button class="btn btn-text btn-text" id="next-btn" onclick="nextQuestion()">Siguiente</button>

        <!-- Botones icono (móvil) -->
        <button class="btn btn-icon" id="restart-icon" onclick="restartBlock()" style="display: none;">⟳</button>
        <button class="btn btn-icon" id="prev-icon" onclick="prevQuestion()" style="display: none;">❮</button>
        <button class="btn btn-icon" id="next-icon" onclick="nextQuestion()">❯</button>

    </div>

</div>






</div>




        </div>

        <div id="result-area">
            <h1>¡Bloque Completado!</h1>
            <div class="score-text" id="final-score"></div>
            <div class="menu">
                <button class="btn btn-outline" onclick="restartBlock()">Repetir este Bloque</button>
                <button class="btn" onclick="returnToBlocks()">Volver a los Bloques</button>
            </div>
        </div>
    </div>

    <script>

                     {enunciado:"¿Qué comando permite ver la versión del núcleo en Linux?", opciones:["ping","uname -r","sysinfo"], correcta:1, feedback:["Incorrecto. Prueba la conectividad de red.","¡Correcto! uname muestra información del sistema y -r (release) especifica la versión del kernel.","Incorrecto. No es un comando estándar nativo en Linux."]},
                    {enunciado:"¿Qué utilidad muestra mensajes del arranque relacionados con el kernel?", opciones:["dmesg","sudo start-kernel","bootmsg"], correcta:0, feedback:["¡Correcto! Permite leer el 'ring buffer' del kernel para ver cómo se inicializó el hardware.","Incorrecto. Este comando no existe en Linux.","Incorrecto. Es un nombre inventado."]},
                    {enunciado:"¿Qué es un hipervisor?", opciones:["Un servidor DNS","Un software que permite ejecutar máquinas virtuales","Una herramienta para editar particiones"], correcta:1, feedback:["Incorrecto. DNS resuelve nombres de dominio.","¡Correcto! Es la capa de software que aísla y asigna los recursos físicos a las VMs.","Incorrecto. Eso lo hacen herramientas como fdisk o parted."]},
                    {enunciado:"¿Qué programa se usa para virtualización en tu práctica?", opciones:["Photoshop","VirtualBox","Premiere"], correcta:1, feedback:["Incorrecto. Edición de imágenes.","¡Correcto! Es un hipervisor de tipo 2 (se instala sobre tu SO) muy usado.","Incorrecto. Edición de vídeo."]},
                    {enunciado:"¿Qué debes instalar para tener un servidor Linux funcional?", opciones:["Ubuntu Server","Windows XP","Android OS"], correcta:0, feedback:["¡Correcto! Distro oficial optimizada para servidor, generalmente sin entorno gráfico.","Incorrecto. Es de Microsoft y obsoleto.","Incorrecto. SO para dispositivos móviles."]},
                    {enunciado:"UEFI es…", opciones:["La versión moderna del BIOS","Un sistema de archivos de Linux","Un servicio de impresión"], correcta:0, feedback:["¡Correcto! Unified Extensible Firmware Interface inicializa el hardware superando las limitaciones del BIOS.","Incorrecto. Ejemplos son ext4 o xfs.","Incorrecto. En Linux es CUPS."]},
                    {enunciado:"MBR y GPT se usan para…", opciones:["Crear usuarios","Organizar particiones en un disco","Configurar redes inalámbricas"], correcta:1, feedback:["Incorrecto. Nada que ver con usuarios.","¡Correcto! Son esquemas de tablas de particiones. GPT es el estándar moderno.","Incorrecto."]},
                    {enunciado:"¿Qué gestor de arranque es común en Linux moderno?", opciones:["GRUB","SYSBOOT","UBOOT"], correcta:0, feedback:["¡Correcto! GRand Unified Bootloader es el gestor estándar en la inmensa mayoría de distros.","Incorrecto. No es estándar en Linux.","Incorrecto. Se usa en sistemas embebidos."]},
                    {enunciado:"En modo Bridge, la máquina virtual…", opciones:["No tiene IP","Se conecta a la red como un dispositivo más con su propia IP","Solo se comunica consigo misma"], correcta:1, feedback:["Incorrecto. Necesita IP para comunicarse.","¡Correcto! Utiliza la tarjeta física para puentearse y pedir su propia IP al router.","Incorrecto. Eso sería Host-Only."]},
                    {enunciado:"Ping sirve para…", opciones:["Instalar actualizaciones","Probar conectividad entre dos dispositivos","Crear cuentas de usuario"], correcta:1, feedback:["Incorrecto. Se hace con apt o yum.","¡Correcto! Envía paquetes ICMP para verificar que el destino es accesible por red.","Incorrecto."]},
                    {enunciado:"¿Qué herramienta crea un USB de instalación de Windows 10?", opciones:["Media Creation Tool","winusb.exe","usbmaker"], correcta:0, feedback:["¡Correcto! Es la utilidad oficial de Microsoft para crear medios booteables.","Incorrecto. No es el nombre oficial.","Incorrecto."]},

                    {enunciado:"¿Qué es WSL en Windows?", opciones:["Un servidor web","Un subsistema que permite ejecutar Linux dentro de Windows","Un gestor de particiones"], correcta:1, feedback:["Incorrecto.","¡Correcto! Windows Subsystem for Linux permite correr un entorno Linux nativo en Windows.","Incorrecto."]},
                    {enunciado:"Si creas un usuario local en Windows y lo añades al grupo “Usuarios de Escritorio remoto”, podrás…", opciones:["Instalar actualizaciones","Conectarte por RDP con ese usuario","Usarlo solo en modo seguro"], correcta:1, feedback:["Incorrecto.","¡Correcto! Otorga permisos para iniciar sesión a través del Protocolo de Escritorio Remoto (RDP).","Incorrecto."]},

                    {enunciado:"En la salida de ls -l, ¿qué indica la primera columna, por ejemplo -rwxr-xr--?", opciones:["El tamaño del archivo","El tipo de archivo y los permisos de propietario, grupo y otros","El nombre del propietario y del grupo"], correcta:1, feedback:["Incorrecto.","¡Correcto! Indica si es archivo o directorio, y los permisos rwx.","Incorrecto."]},
                    {enunciado:"¿Cuál de las siguientes letras representa el permiso de ejecución en Linux?", opciones:["r","w","x"], correcta:2, feedback:["Incorrecto. Read.","Incorrecto. Write.","¡Correcto! eXecute."]},
                    {enunciado:"¿Qué ocurre al ejecutar sudo ufw enable en Ubuntu?", opciones:["Activa el firewall y aplica las reglas configuradas","Elimina todas las reglas","Reinicia la red","Permite todo el tráfico"], correcta:0, feedback:["¡Correcto! Arranca UFW (Uncomplicated Firewall) y bloquea el tráfico no deseado.","Incorrecto.","Incorrecto.","Incorrecto."]},
                    {enunciado:"¿Qué efecto tiene sudo ufw allow ssh?", opciones:["Bloquea SSH","Reinicia el servicio SSH","Permite conexiones entrantes al puerto SSH","Elimina reglas"], correcta:2, feedback:["Incorrecto.","Incorrecto.","¡Correcto! Abre el puerto 22 para administración remota.","Incorrecto."]},
                    {enunciado:"¿Qué comando permite ver reglas activas numeradas en UFW?", opciones:["ufw show","ufw list","ufw status","ufw status numbered"], correcta:3, feedback:["Incorrecto.","Incorrecto.","Incorrecto.","¡Correcto! Asigna número de línea para que luego puedas usar ufw delete [num]."]},
                    {enunciado:"¿Qué ocurre si ejecutas sudo ufw disable?", opciones:["Se desactiva el firewall completamente","Se eliminan reglas","Se bloquea todo el tráfico","Solo desactiva SSH"], correcta:0, feedback:["¡Correcto! Apaga el firewall pero mantiene las reglas guardadas.","Incorrecto.","Incorrecto.","Incorrecto."]},
                    {enunciado:"El comando journalctl -u sshd permite:", opciones:["Ver CPU","Ver usuarios","Ver red","Ver logs del servicio SSH"], correcta:3, feedback:["Incorrecto.","Incorrecto.","Incorrecto.","¡Correcto! Filtra los inmensos registros del sistema para mostrar solo los de SSH."]},

                    {enunciado:"¿Qué ventaja tiene htop frente a top?", opciones:["Consume más CPU","Interfaz interactiva y más visual","No muestra procesos","No permite ordenar"], correcta:1, feedback:["Incorrecto.","¡Correcto! Permite usar ratón, colores y hacer scroll para gestionar fácilmente.","Incorrecto.","Incorrecto."]},
                    {enunciado:"¿Qué comando permite ver memoria RAM rápidamente?", opciones:["top","ps","free","uptime"], correcta:2, feedback:["Incorrecto.","Incorrecto.","¡Correcto! Da un resumen instantáneo de la RAM total, usada y libre (free -h).","Incorrecto."]},
                    {enunciado:"¿Qué herramienta es más completa como dashboard de monitorización en Linux?", opciones:["top","free","glances","ps"], correcta:2, feedback:["Incorrecto.","Incorrecto.","¡Correcto! Escrita en Python, unifica CPU, RAM, red, discos y temperatura en una pantalla.","Incorrecto."]},
                    {enunciado:"El comando ps aux muestra:", opciones:["Disco","Lista completa de procesos","Red","Usuarios"], correcta:1, feedback:["Incorrecto.","¡Correcto! Estándar para listar procesos estáticos de todos los usuarios.","Incorrecto.","Incorrecto."]},
                    {enunciado:"¿Qué muestra df -h?", opciones:["RAM","CPU","Espacio en disco","Procesos"], correcta:2, feedback:["Incorrecto.","Incorrecto.","¡Correcto! Lista sistemas de archivos montados y cuánto ocupan en formato humano.","Incorrecto."]},
                    {enunciado:"¿Qué indica uptime?", opciones:["Disco","Tiempo encendido y carga media","Usuarios","Red"], correcta:1, feedback:["Incorrecto.","¡Correcto! Hora, tiempo desde el arranque y el 'load average' del sistema.","Incorrecto.","Incorrecto."]},
                    {enunciado:"¿Qué comando muestra puertos abiertos en Linux?", opciones:["dir","ping","df","ss -tulnp"], correcta:3, feedback:["Incorrecto.","Incorrecto.","Incorrecto.","¡Correcto! Reemplaza a netstat. Muestra conexiones TCP/UDP a la escucha."]},
                    {enunciado:"¿Qué hace sar -u 1 5?", opciones:["Muestra estadísticas de CPU en intervalos","Muestra disco","Muestra usuarios","Muestra red"], correcta:0, feedback:["¡Correcto! Pide datos de CPU (-u), tomando 1 muestra por segundo, 5 veces.","Incorrecto.","Incorrecto.","Incorrecto."]},
                    {enunciado:"¿Qué hace Get-Process en PowerShell?", opciones:["Ver red","Listar procesos activos","Ver disco","Ver usuarios"], correcta:1, feedback:["Incorrecto.","¡Correcto! Es el equivalente de Microsoft a 'ps'. Muestra procesos y consumo.","Incorrecto.","Incorrecto."]},
                    {enunciado:"Sort-Object CPU -Descending sirve para:", opciones:["Borrar procesos","Ordenar procesos por uso de CPU descendente","Reiniciar procesos","Filtrar memoria"], correcta:1, feedback:["Incorrecto.","¡Correcto! Se usa tras un pipe para poner arriba a los que más gastan.","Incorrecto.","Incorrecto."]},
                    {enunciado:"¿Qué hace Select-Object -First 10?", opciones:["Selecciona últimos","Filtra errores","Selecciona los primeros elementos","Ordena"], correcta:2, feedback:["Incorrecto.","Incorrecto.","¡Correcto! Trunca la salida mostrando solo las 10 primeras líneas.","Incorrecto."]},
                    {enunciado:"¿Qué muestra Get-Service?", opciones:["Estado de servicios del sistema","Usuarios","Red","Disco"], correcta:0, feedback:["¡Correcto! Lista si están en ejecución (Running) o detenidos (Stopped).","Incorrecto.","Incorrecto.","Incorrecto."]},
                    {enunciado:"¿Qué mide Get-Counter \"\\Processor(_Total)% Processor Time\"?", opciones:["RAM","Uso de CPU","Disco","Red"], correcta:1, feedback:["Incorrecto.","¡Correcto! Accede a contadores de rendimiento dando el porcentaje de uso de CPU.","Incorrecto.","Incorrecto."]},
                    {enunciado:"¿Qué mide Get-Counter \"\\Memory\\Available MBytes\"?", opciones:["CPU","Disco","Memoria disponible","Red"], correcta:2, feedback:["Incorrecto.","Incorrecto.","¡Correcto! Indica exactamente cuántos Megabytes de RAM están libres.","Incorrecto."]},
                    {enunciado:"¿Qué hace Test-Connection google.es?", opciones:["Ver CPU","Ver RAM","Probar conectividad de red","Ver disco"], correcta:2, feedback:["Incorrecto.","Incorrecto.","¡Correcto! Es la versión nativa de PowerShell del comando ping.","Incorrecto."]},
                    {enunciado:"¿Qué muestra Get-NetTCPConnection?", opciones:["Conexiones TCP activas","Usuarios","CPU","RAM"], correcta:0, feedback:["¡Correcto! Herramienta equivalente a netstat para monitorizar puertos.","Incorrecto.","Incorrecto.","Incorrecto."]},
                    {enunciado:"¿Qué muestra Get-NetAdapter?", opciones:["CPU","RAM","Interfaces de red","Disco"], correcta:2, feedback:["Incorrecto.","Incorrecto.","¡Correcto! Lista tarjetas de red, estado (conectado/desconectado) y velocidad.","Incorrecto."]},
                    {enunciado:"¿Qué hace Get-WinEvent -LogName System?", opciones:["Reinicia sistema","Ver procesos","Mostrar eventos del sistema","Crear logs"], correcta:2, feedback:["Incorrecto.","Incorrecto.","¡Correcto! Permite leer los registros del Visor de Eventos filtrando por Sistema.","Incorrecto."]},
                    {enunciado:"¿Qué hace who en Linux?", opciones:["CPU","Usuarios conectados","Disco","Red"], correcta:1, feedback:["Incorrecto.","¡Correcto! Muestra qué usuarios han iniciado sesión y desde dónde.","Incorrecto.","Incorrecto."]},

            "Lenguaje de Marcas (LM)": {
                "HTML5 y Semántica": [
                    {enunciado:"¿Qué indica exactamente <!DOCTYPE html> en HTML5?", opciones:["La versión concreta del navegador","Que el documento usa XHTML","Que el documento sigue el estándar HTML5","Que el documento contiene etiquetas semánticas"], correcta:2, feedback:["No tiene relación con el navegador.","Eso era en versiones muy antiguas.","¡Correcto! Es la instrucción obligatoria para que el navegador renderice en HTML5.","No garantiza que el código por dentro esté bien estructurado."]},
                     {enunciado:"¿Cuál es la función principal del elemento <main>?", opciones:["Contener el menú de navegación","Incluir contenido repetido en todas las páginas","Agrupar el contenido principal único del documento","Sustituir a <body>"], correcta:2, feedback:["Para el menú se usa <nav>.","Ese sería el caso de un <header> o <footer>.","¡Exacto! Engloba lo verdaderamente importante de esa página en concreto.","Va dentro del <body>, no lo sustituye."]},
                    {enunciado:"¿Cuántos elementos <main> debe haber por documento HTML válido?", opciones:["Ninguno","Uno","Dos como máximo","Ilimitados"], correcta:1, feedback:["Es muy recomendable tenerlo para la accesibilidad.","¡Sí! Solo debe haber un contenido principal activo visible por página.","Son demasiados.","Perdería su sentido semántico."]},
                    {enunciado:"¿Qué etiqueta NO es semántica en HTML5?", opciones:["<article>","<section>","<aside>","<div>"], correcta:3, feedback:["Es semántica (artículo independiente).","Es semántica (sección genérica).","Es semántica (contenido lateral).","¡Correcto! El div es un contenedor vacío que no aporta significado, solo agrupa."]},
                    {enunciado:"¿Cuándo es correcto usar <section> en lugar de <div>?", opciones:["Siempre que se quiera agrupar contenido","Cuando el contenido tiene sentido semántico y un título","Solo dentro de <article>","Para aplicar estilos CSS"], correcta:1, feedback:["Para agrupar sin significado, usa <div>.","¡Eso es! Una <section> agrupa un tema concreto y suele llevar un <h2> o <h3>.","Puede ir fuera perfectamente.","Para estilos sin significado semántico es mejor <div>."]},
                    {enunciado:"¿Qué etiqueta es más adecuada para una noticia independiente?", opciones:["<section>","<div>","<article>","<aside>"], correcta:2, feedback:["Agrupa, pero no implica independencia.","No tiene significado.","¡Correcto! <article> es para contenido que tendría sentido si lo lees fuera de la web (como un post o noticia).","Es para barras laterales o contenido de apoyo."]},
                    {enunciado:"¿Qué diferencia clave hay entre <strong> y <b>?", opciones:["Ninguna","<strong> aporta importancia semántica","<b> es obligatorio en HTML5","<strong> solo cambia el tamaño del texto"], correcta:1, feedback:["Visualmente son iguales (negrita), pero internamente no.","¡Exacto! <strong> le dice a los lectores de pantalla que esa palabra es clave.","No es obligatorio.","No cambia el tamaño, cambia el grosor y el significado."]},
                    {enunciado:"¿Qué atributo mejora la accesibilidad de una imagen decorativa?", opciones:["title","alt=\"\" vacío","src","role=\"img\""], correcta:1, feedback:["Muestra un tooltip al pasar el ratón, no ayuda a lectores de pantalla.","¡Sí! Al dejarlo vacío, el lector de pantalla ignora la imagen porque sabe que es solo de adorno.","Indica la ruta, es obligatorio pero no de accesibilidad.","No es necesario si ya usas <img>."]},
                    {enunciado:"¿Qué ocurre si una imagen no tiene atributo alt?", opciones:["El navegador no la muestra","No pasa nada","Se perjudica la accesibilidad","Se carga más lenta"], correcta:2, feedback:["Se mostrará igualmente si la ruta es correcta.","A nivel de validación y SEO sí pasa.","¡Exacto! Las personas ciegas no sabrán qué hay en la imagen y los buscadores te penalizarán.","No afecta a la velocidad."]},
                    {enunciado:"¿Qué etiqueta es correcta para un menú de navegación?", opciones:["<menu>","<ul>","<nav>","<header>"], correcta:2, feedback:["Existe, pero se usa para menús de herramientas/contextuales.","Es una lista, el menú va dentro, pero falta el contenedor.","¡Correcto! <nav> (navigation) es la etiqueta semántica ideal.","El header es la cabecera, suele contener al <nav> pero no es el menú en sí."]},
                    {enunciado:"¿Qué etiqueta se usa para asociar un texto a un campo de formulario?", opciones:["<input>","<label>","<fieldset>","<legend>"], correcta:1, feedback:["Es la caja donde escribes.","¡Sí! El label es la 'etiqueta' o texto descriptivo del campo.","Agrupa varios campos.","Es el título de un fieldset."]},
                    {enunciado:"¿Cómo se asocia correctamente un <label> con un <input>?", opciones:["Usando el mismo name","Usando for y id","Colocándolos en la misma línea","Usando class"], correcta:1, feedback:["El name es para enviar los datos al servidor.","¡Exacto! El atributo 'for' del label debe ser igual al 'id' del input.","No los asocia a nivel de código.","Las clases son para CSS."]},
                    {enunciado:"¿Qué atributo hace obligatorio un campo de formulario?", opciones:["validate","important","required","mandatory"], correcta:2, feedback:["No existe en HTML5 estándar.","Se usa en CSS (!important).","¡Correcto! Impide enviar el formulario si está vacío.","No es la palabra reservada en HTML."]},
                    {enunciado:"¿Qué tipo de <input> valida automáticamente un email?", opciones:["text","mail","email","validate-email"], correcta:2, feedback:["Acepta cualquier texto.","No existe.","¡Sí! type='email' obliga a poner un @ y un dominio básico.","No existe."]},
                    {enunciado:"¿Qué elemento agrupa campos relacionados en un formulario?", opciones:["<form>","<group>","<fieldset>","<section>"], correcta:2, feedback:["Engloba todo el formulario, no subgrupos.","No existe.","¡Correcto! Crea una caja visual y semántica alrededor de los campos.","Es muy genérico para formularios."]},
                    {enunciado:"¿Qué etiqueta proporciona un título a un <fieldset>?", opciones:["<title>","<caption>","<legend>","<label>"], correcta:2, feedback:["Va en el <head> de la página.","Es para el título de las tablas (<table>).","¡Exacto! Se incrusta en el borde superior del fieldset.","Es para un solo <input>."]},
                    {enunciado:"¿Qué etiqueta es correcta para contenido secundario relacionado?", opciones:["<aside>","<footer>","<header>","<nav>"], correcta:0, feedback:["¡Sí! Perfecto para barras laterales, publicidad o notas aclaratorias.","Es el pie de página.","Es la cabecera.","Es para navegación."]},
                    {enunciado:"¿Dónde debe colocarse el <footer> de un artículo?", opciones:["Solo al final del <body>","Nunca dentro de <article>","Dentro o fuera del <article> según el contexto","Solo dentro de <header>"], correcta:2, feedback:["Puede haber varios footers en una web.","Falso, un article puede tener el suyo propio.","¡Correcto! Si es el pie del artículo, va dentro; si es de la web, va abajo del todo.","No tiene sentido semántico."]},
                    {enunciado:"¿Qué atributo indica el idioma del documento HTML?", opciones:["charset","lang","language","xml:lang"], correcta:1, feedback:["Define la codificación (ej. UTF-8).","¡Exacto! Imprescindible para SEO y lectores de pantalla.","Atributo antiguo u obsoleto.","Se usa en XML o XHTML antiguo."]},
                    {enunciado:"¿Dónde debe colocarse el atributo lang=\"es\"?", opciones:["En <head>","En <body>","En <html>","En <meta>"], correcta:2, feedback:["No aplica.","Solo aplicaría al cuerpo.","¡Correcto! Se pone en la etiqueta raíz para que afecte a todo el documento.","Los metas llevan otro tipo de info."]},
                    {enunciado:"¿Qué etiqueta representa contenido autocontenido como un diagrama o imagen con pie?", opciones:["<img>","<figure>","<aside>","<section>"], correcta:1, feedback:["Solo mete la foto, sin envoltorio.","¡Sí! Agrupa la imagen y su explicación.","Es para contenido tangencial.","Demasiado genérico."]},
                    {enunciado:"¿Qué etiqueta define el texto descriptivo de una <figure>?", opciones:["<caption>","<description>","<figcaption>","<legend>"], correcta:2, feedback:["Es para tablas.","No existe.","¡Correcto! Figure Caption, es el pie de foto semántico.","Es para fieldsets."]},
                    {enunciado:"¿Qué atributo mejora la accesibilidad indicando la finalidad de un enlace?", opciones:["href","target","aria-label","rel"], correcta:2, feedback:["Es la URL destino.","Indica dónde se abre.","¡Sí! Le lee en voz alta al usuario ciego para qué sirve el enlace (ej: 'Ir al perfil').","Indica relación (ej. stylesheet)."]},
                    {enunciado:"¿Qué valor de target abre un enlace en una nueva pestaña?", opciones:["_self","_new","_blank","_tab"], correcta:2, feedback:["Lo abre en la misma pestaña (por defecto).","No es el estándar.","¡Correcto! Blank significa 'en blanco' (nueva pestaña/ventana).","No existe."]},
                    {enunciado:"¿Qué atributo se recomienda añadir junto a target=\"_blank\" por seguridad?", opciones:["rel=\"nofollow\"","rel=\"noopener noreferrer\"","rel=\"external\"","rel=\"secure\""], correcta:1, feedback:["Para SEO (no seguir el link).","¡Exacto! Evita que la nueva pestaña acceda maliciosamente a tu web original.","No aporta esa seguridad.","No existe."]},
                    {enunciado:"¿Qué etiqueta se usa para contenido de fecha/hora legible por máquinas?", opciones:["<date>","<time>","<datetime>","<meta>"], correcta:1, feedback:["No existe.","¡Sí! Permite marcar fechas para que los buscadores las entiendan bien.","Es el atributo que lleva dentro.","No se usa así."]},
                    {enunciado:"¿Qué atributo de <time> almacena el valor en formato máquina?", opciones:["machine","value","datetime","data-time"], correcta:2, feedback:["No existe.","Suele ser para inputs.","¡Correcto! Así pones <time datetime='2024-01-01'>Año Nuevo</time>.","Invención."]},
                    {enunciado:"¿Qué práctica es INCORRECTA según buenas prácticas HTML?", opciones:["Usar <div> para todo","Usar etiquetas semánticas","Usar alt en imágenes","Definir el idioma del documento"], correcta:0, feedback:["¡Exacto! A esto se le llama 'Divitis'. Hay que usar section, article, nav...","Es correcto.","Es correcto.","Es correcto."]},
                    {enunciado:"¿Qué diferencia clave hay entre <section> y <article>?", opciones:["Ninguna","<article> puede ser independiente","<section> es solo visual","<article> sustituye a <div>"], correcta:1, feedback:["Sí la hay.","¡Correcto! Si te lo llevas a otra web, el article se entiende por sí solo. La section no.","La section es semántica, no visual.","No sustituye, conviven."]},
                    {enunciado:"¿Qué objetivo principal tiene el HTML semántico?", opciones:["Mejorar el diseño visual","Reducir el código","Mejorar accesibilidad, SEO y comprensión","Sustituir CSS"], correcta:2, feedback:["De eso se encarga CSS.","A veces lo alarga un poco.","¡Sí! Las máquinas (Google y lectores de voz) entenderán tu web.","Nunca."]
                    }

                ],
                "CSS Básico": [
                    {enunciado:"¿Qué significan las siglas CSS?", opciones:["Computer Style Sheets","Cascading Style Sheets","Creative Style System","Color Style Sheets"], correcta:1, feedback:["Falso.","¡Correcto! Hojas de Estilo en Cascada (las reglas de abajo pisan a las de arriba).","Falso.","Falso."]},
                    {enunciado:"¿Cuál es la función principal de CSS?", opciones:["Estructurar el contenido","Programar interactividad","Definir el diseño y estilo visual","Gestionar bases de datos"], correcta:2, feedback:["Eso lo hace HTML.","Eso lo hace JavaScript.","¡Exacto! Colores, tamaños, posiciones... Todo lo visual.","Eso es SQL/Backend."]},
                    {enunciado:"¿Qué propiedad cambia el color del texto?", opciones:["text-color","font-color","color","foreground"], correcta:2, feedback:["Parece lógica, pero no existe.","No existe.","¡Sí! Simplemente 'color' (herencia del pasado).","Se usa en otros lenguajes."]},
                    {enunciado:"¿Qué propiedad cambia el tamaño del texto?", opciones:["text-size","font-style","font-size","size"], correcta:2, feedback:["No existe.","Cambia a cursiva (italic).","¡Correcto! Font-size dicta el tamaño de la fuente.","Demasiado genérico."]},
                    {enunciado:"¿Qué unidad es relativa al tamaño de la fuente del elemento raíz (html)?", opciones:["em","px","%","rem"], correcta:3, feedback:["Es relativa a su padre directo, no a la raíz.","Es un valor absoluto.","Es relativo al bloque padre.","¡Exacto! Root Em (rem). Ideal para diseño responsive."]},
                    {enunciado:"¿Qué unidad es relativa al tamaño de la fuente del elemento padre?", opciones:["px","rem","em","vh"], correcta:2, feedback:["Píxeles fijos.","Relativo a la raíz (html).","¡Sí! 'em' multiplica el tamaño de su contenedor padre.","Altura de la ventana (Viewport Height)."]},
                    {enunciado:"¿Qué selector selecciona TODOS los elementos <p>?", opciones:[".p","#p","p","*p"], correcta:2, feedback:["Elegiría clases llamdas 'p'.","Elegiría un id llamado 'p'.","¡Correcto! El selector de etiqueta va limpio.","Sintaxis incorrecta."]},
                    {enunciado:"¿Qué selector selecciona un elemento con id=\"menu\"?", opciones:[".menu","menu","#menu","*menu"], correcta:2, feedback:["Selecciona una clase.","Selecciona la etiqueta <menu>.","¡Exacto! La almohadilla o hashtag (#) es para los ID (únicos).","Sintaxis incorrecta."]},
                    {enunciado:"¿Qué selector selecciona elementos con class=\"activo\"?", opciones:["#activo",".activo","activo","*activo"], correcta:1, feedback:["Selecciona un ID.","¡Sí! El punto (.) busca atributos de clase, que pueden repetirse.","Seleccionaría etiqueta.","Sintaxis incorrecta."]},
                    {enunciado:"¿Qué propiedad controla el espacio INTERIOR de un elemento?", opciones:["margin","border","padding","spacing"], correcta:2, feedback:["Es el exterior (margen).","Es la línea que separa.","¡Correcto! Es el 'relleno' entre el borde y el contenido.","No existe."]},
                    {enunciado:"¿Qué propiedad controla el espacio EXTERIOR de un elemento?", opciones:["padding","border","margin","gap"], correcta:2, feedback:["Es interior.","Es el borde.","¡Exacto! Empuja a los demás elementos lejos de este.","Es para Grid y Flexbox."]},
                    {enunciado:"¿Qué pseudoclase selecciona el primer hijo?", opciones:[":first","::first-child",":first-child",":first-of-type"], correcta:2, feedback:["No existe.","Doble punto es para pseudoelementos (ej. ::before).","¡Correcto! Selecciona si es el primerísimo elemento dentro de su padre.","Selecciona el primero de su tipo, aunque no sea el hijo número uno."]},
                    {enunciado:"¿Qué pseudoclase selecciona un enlace cuando el ratón pasa por encima?", opciones:[":active",":focus",":hover",":visited"], correcta:2, feedback:["Cuando estás haciendo clic.","Cuando navegas con el tabulador.","¡Exacto! El efecto 'hover' da mucha interactividad visual.","Cuando ya has entrado al link antes."]},
                    {enunciado:"¿Qué propiedad define el color de fondo?", opciones:["background-color","color","bg-color","background"], correcta:0, feedback:["¡Sí! Se puede usar 'background' a secas como atajo, pero esta es la estricta para color.","Color de texto.","Atajo no válido en CSS puro.","Atajo válido, pero la 1 es más precisa para color."]},

            "Fundamentos de Hardware (FH)": {
                "Tema 1: Arquitectura y Software Básicos": [
                    {enunciado: "¿En qué década se propuso la arquitectura Von Neumann, base de los ordenadores actuales?", opciones: ["1930", "1940", "1950", "1960"], correcta: 1, feedback: ["Demasiado pronto, aún estábamos en calculadoras mecánicas/electromecánicas.","¡Correcto! John von Neumann publicó su famoso borrador en 1945.","Ya existían ordenadores en esta década basados en su diseño.","En esta década ya usábamos transistores avanzados."]},
                    {enunciado: "¿Cuál es la principal diferencia entre la arquitectura Von Neumann y la Harvard?", opciones: ["Von Neumann no usa CPU", "Von Neumann usa la misma memoria para datos e instrucciones; Harvard las separa", "Harvard es más antigua", "Von Neumann solo sirve para servidores"], correcta: 1, feedback: ["Ambas usan Unidad Central de Procesamiento.","¡Exacto! Von Neumann usa un bus único (cuello de botella), mientras que Harvard tiene memorias y buses separados.","No es la diferencia técnica fundamental.","Falso, casi todos los PCs de escritorio usan arquitectura basada en Von Neumann."]},
                    {enunciado: "¿Qué componente de la CPU se encarga de coordinar todas las operaciones como un 'director de orquesta'?", opciones: ["ALU", "Unidad de Control (CU)", "Memoria RAM", "Bus de datos"], correcta: 1, feedback: ["La ALU solo calcula, no dirige.","¡Correcto! La Control Unit (CU) lee las instrucciones y dice a los demás qué hacer.","La RAM almacena, no coordina.","El bus es solo el 'cable' por donde viaja la info."]},
                    {enunciado: "¿Cuál es la función de la Unidad Aritmético-Lógica (ALU)?", opciones: ["Almacenar datos", "Realizar cálculos matemáticos y comparaciones lógicas", "Gestionar la energía", "Conectar el ratón"], correcta: 1, feedback: ["Para eso están los registros y la memoria.","¡Sí! Es la calculadora interna del procesador (sumas, restas, AND, OR...).","Eso lo hace la fuente o el VRM.","Eso es trabajo del chipset o los puertos de E/S."]},
                    {enunciado: "¿Qué característica define a la memoria RAM?", opciones: ["Es permanente", "Es volátil (se borra al apagar)", "Es más lenta que el disco duro", "Solo es de lectura"], correcta: 1, feedback: ["No, pierde los datos sin energía.","¡Correcto! Necesita electricidad constante para mantener la información.","Al revés, es muchísimo más rápida.","Es de lectura y escritura (Random Access Memory)."]},
                    {enunciado: "¿Cuál es el orden correcto de memorias de más rápida/cara a más lenta/barata?", opciones: ["HDD > RAM > Caché > Registros", "Registros > Caché > RAM > Almacenamiento", "RAM > Registros > Caché > HDD", "SSD > RAM > Registros > Caché"], correcta: 1, feedback: ["El orden está invertido.","¡Exacto! Los registros son instantáneos pero enanos; el disco es enorme pero lento.","Los registros y la caché son más rápidos que la RAM.","El almacenamiento (SSD) siempre es más lento que la memoria volátil."]},
                    {enunciado: "¿Qué bus se utiliza para indicar en qué posición de memoria se quiere leer o escribir?", opciones: ["Bus de datos", "Bus de control", "Bus de direcciones", "Bus USB"], correcta: 2, feedback: ["Transporta la información en sí, no la ubicación.","Envía señales como 'leer' o 'escribir'.","¡Sí! Manda la dirección exacta (como el código postal) a la memoria.","Es un bus externo para periféricos."]},
                    {enunciado: "¿Qué tipo de software gestiona los recursos del hardware y permite la ejecución de aplicaciones?", opciones: ["Driver", "Sistema Operativo", "Firmware", "Shareware"], correcta: 1, feedback: ["Solo controla un dispositivo específico.","¡Correcto! Es el intermediario principal entre tú, las apps y la máquina (ej: Windows, Linux).","Es un software muy básico grabado en hardware (como la BIOS).","Es un tipo de licencia comercial."]},
                    {enunciado: "¿Cómo se llama el software que traduce las órdenes del SO para un hardware específico?", opciones: ["BIOS", "Controlador (Driver)", "Kernel", "Compilador"], correcta: 1, feedback: ["Inicia el sistema antes de que cargue el SO.","¡Exacto! Le enseña al Sistema Operativo cómo 'hablar' con una gráfica o impresora nueva.","Es el núcleo del sistema operativo, no un traductor específico.","Traduce código de programación a lenguaje máquina."]},
                    {enunciado: "¿Qué licencia define al software propietario gratuito pero con restricciones de copia?", opciones: ["Software Libre", "Shareware", "Freeware", "Open Source"], correcta: 2, feedback: ["Permite ver y modificar el código.","Suele ser de prueba (pide pagar después).","¡Correcto! Es gratis (Free) pero no puedes modificar su código ni venderlo.","Es de código abierto."]},
                    {enunciado: "¿Qué software permite probarlo gratis un tiempo y luego pide pago?", opciones: ["Freeware", "Shareware", "Adware", "Firmware"], correcta: 1, feedback: ["Es gratis siempre.","¡Sí! Es la típica versión de prueba de 30 días.","Software que muestra publicidad.","Software incrustado en chips."]},
                    {enunciado: "¿Cuántas libertades fundamentales definen al Software Libre?", opciones: ["Dos", "Tres", "Cuatro", "Cinco"], correcta: 2, feedback: ["Faltan libertades.","Falta una.","¡Exacto! Usar (0), Estudiar/Modificar (1), Distribuir copias (2) y Mejorar/Publicar (3).","Te has pasado."]},
                    {enunciado: "¿Qué es un SoC (System on a Chip)?", opciones: ["Un sistema operativo", "Un chip que integra CPU, GPU y otros componentes", "Un tipo de memoria RAM", "Un cable de conexión"], correcta: 1, feedback: ["Es hardware, no software.","¡Correcto! Típico en móviles (como los Snapdragon) o chips de Apple (M1/M2).","No es RAM, aunque a veces la incluye dentro.","No es un cable."]},
                    {enunciado: "¿Por qué es falso que 'Solo importan los GHz'?", opciones: ["Porque los GHz no existen", "Porque influyen la arquitectura, IPC, núcleos y caché", "Porque el software es más importante", "Porque la RAM es lo único que importa"], correcta: 1, feedback: ["Sí existen, miden los ciclos por segundo.","¡Sí! Un procesador a 3GHz moderno aplasta a uno a 4GHz de hace 10 años por su eficiencia (IPC).","El software importa, pero a nivel hardware hay más métricas.","La RAM no procesa."]},
                    {enunciado: "¿Qué elemento de Von Neumann gestiona la comunicación con el exterior?", opciones: ["CPU", "RAM", "Subsistema de Entrada/Salida", "Buses"], correcta: 2, feedback: ["Calcula y controla.","Almacena temporalmente.","¡Correcto! Los periféricos (teclado, pantalla) se comunican a través de I/O.","Transportan datos internamente."]},
                    {enunciado: "¿Cuál es el bus por el que viaja la información real procesada?", opciones: ["Bus de direcciones", "Bus de datos", "Bus de expansión", "Bus de sistema"], correcta: 1, feedback: ["Lleva la ubicación.","¡Exacto! Por aquí viajan los 'unos y ceros' reales de los archivos y cálculos.","Para tarjetas extra.","Engloba a todos los buses de la CPU."]},
                    {enunciado: "¿Qué componente es la base física donde se conectan todos los demás?", opciones: ["CPU", "Memoria", "Placa Base", "Disco duro"], correcta: 2, feedback: ["Es el cerebro, necesita conectarse a la base.","Se inserta en la base.","¡Correcto! La Placa Base (Motherboard) interconecta absolutamente todo.","Se conecta a la placa mediante cables o ranuras."]},
                    {enunciado: "¿Qué tipo de software es Linux?", opciones: ["Propietario", "Shareware", "Software Libre", "Freeware"], correcta: 2, feedback: ["Windows o macOS lo son.","No es de pago.","¡Sí! Su código (kernel) está abierto a la comunidad bajo licencia GPL.","Aunque es gratis, freeware no implica que el código sea abierto."]},
                    {enunciado: "¿Qué ventaja tiene el software libre sobre el propietario?", opciones: ["Es siempre más bonito", "Permite estudiar y modificar el código", "No requiere instalación", "Funciona sin RAM"], correcta: 1, feedback: ["La estética depende de los diseñadores, no de la licencia.","¡Correcto! Evita depender de una sola empresa y permite auditorías de seguridad.","Requiere instalación igual.","Imposible, todo necesita RAM."]},
                    {enunciado: "¿Qué componente mantiene las instrucciones mientras se ejecutan?", opciones: ["HDD", "RAM", "Unidad de Control", "Monitor"], correcta: 1, feedback: ["Es demasiado lento para dárselas a la CPU en tiempo real.","¡Exacto! El SO carga los programas del disco a la RAM para que la CPU trabaje rápido.","Las lee, pero no las almacena en masa.","Solo muestra la imagen."]
                    }

                "Tema 2: Placa Base, BIOS y UEFI": [
                    {enunciado: "¿Qué componente físico aloja la CPU en la placa base?", opciones: ["Ranura RAM", "Zócalo (Socket)", "Chipset", "Puente Norte"], correcta: 1, feedback: ["Son alargadas y para memoria.","¡Correcto! Es el 'nido' cuadrado lleno de pines (o agujeros) exclusivo para el procesador.","Es un chip soldado en la placa.","Parte del chipset."]},
                    {enunciado: "¿Cómo se llaman las ranuras donde se insertan los módulos de memoria?", opciones: ["PCIe", "DIMM", "SATA", "M.2"], correcta: 1, feedback: ["Para tarjetas gráficas o de red.","¡Sí! Dual In-line Memory Module, son las ranuras alargadas cerca de la CPU.","Puertos para discos.","Ranura para SSD modernos."]},
                    {enunciado: "¿Cuál es la diferencia de velocidad entre un SSD SATA y un SSD M.2 NVMe?", opciones: ["SATA es más rápido", "M.2 NVMe es mucho más rápido al usar PCIe", "Son iguales", "M.2 es solo para portátiles"], correcta: 1, feedback: ["SATA tiene un límite teórico de 600 MB/s.","¡Exacto! Al ir directo por líneas PCIe, NVMe puede superar los 7000 MB/s.","Para nada.","Se usan muchísimo en sobremesas también."]},
                    {enunciado: "¿Qué tipo de disco duro usa platos giratorios y cabezales mecánicos?", opciones: ["SSD", "HDD", "NVMe", "SD"], correcta: 1, feedback: ["Solid State Drive, sin partes móviles.","¡Correcto! Hard Disk Drive, funciona como un tocadiscos magnético.","Es un protocolo rápido.","Tarjeta de memoria flash."]},
                    {enunciado: "¿Qué ranura de expansión se usa típicamente para las tarjetas gráficas modernas?", opciones: ["PCI", "AGP", "PCI Express x16", "PCI Express x1"], correcta: 2, feedback: ["Obsoleto y lento.","Obsoleto, antes de PCIe.","¡Sí! Es la ranura más larga y rápida de la placa base.","Es muy pequeña, para tarjetas de sonido o Wi-Fi."]},
                    {enunciado: "¿Qué gestiona el Chipset de la placa base?", opciones: ["La energía de la fuente", "El flujo de datos entre CPU, memoria y periféricos", "La velocidad del ventilador", "El teclado"], correcta: 1, feedback: ["Eso hace la fuente y los VRM.","¡Correcto! Es el 'guardia de tráfico' que enruta los datos en la placa.","Lo controla un chip menor o la BIOS.","Lo controla la I/O."]},
                    {enunciado: "¿Qué limitación de tamaño de disco tiene la BIOS tradicional frente a UEFI?", opciones: ["BIOS no tiene límite", "BIOS está limitada a 2.2 TB", "UEFI está limitada a 1 TB", "Ambas son iguales"], correcta: 1, feedback: ["Sí lo tiene por su sistema de particiones MBR.","¡Exacto! BIOS usa MBR (máx 2.2TB), mientras que UEFI usa GPT (soporta discos masivos).","UEFI soporta zettabytes.","No, UEFI es la evolución."]},
                    {enunciado: "¿Qué ventaja ofrece UEFI respecto a la interfaz de usuario?", opciones: ["Es solo texto", "Soporta gráficos, uso del ratón y red", "No tiene interfaz", "Es más lenta"], correcta: 1, feedback: ["Eso era la BIOS antigua.","¡Sí! Es como un mini sistema operativo visual.","Sí tiene.","Al revés, arranca más rápido."]},
                    {enunciado: "¿Qué es el POST (Power-On Self-Test)?", opciones: ["Un tipo de cable", "Un autodiagnóstico al encender el PC", "Un programa para instalar Windows", "Un virus"], correcta: 1, feedback: ["Falso.","¡Correcto! Comprueba que haya RAM, CPU y gráfica funcionales antes de arrancar.","Eso es el instalador.","No."]},
                    {enunciado: "¿Dónde se guardan los ajustes de la BIOS/UEFI cuando el PC está apagado?", opciones: ["En el HDD", "En la memoria CMOS (alimentada por pila)", "En la RAM", "En internet"], correcta: 1, feedback: ["Si cambias de disco, la BIOS no se borra.","¡Exacto! Por eso si se gasta la pila de botón CR2032, la hora se desconfigura.","La RAM normal se borra al 100%.","No requiere conexión."]},
                    {enunciado: "¿Qué función cumple el factor de forma ATX?", opciones: ["Define la velocidad de la CPU", "Define las dimensiones estándar de la placa y ubicación de tornillos", "Es un tipo de memoria", "Es un protocolo de red"], correcta: 1, feedback: ["Falso.","¡Sí! Gracias al ATX puedes comprar una placa ASUS y que encaje en una caja Corsair.","Falso.","Falso."]},
                    {enunciado: "¿Qué ocurre si el POST detecta un error crítico en la RAM?", opciones: ["El PC explota", "Emite una secuencia de pitidos o códigos LED", "Inicia Windows normalmente", "Se borra el disco"], correcta: 1, feedback: ["No dramemos.","¡Correcto! La placa avisa con pitidos (Beep Codes) o luces en el panel de depuración.","Imposible sin RAM.","Los datos siguen a salvo en el disco."]},
                    {enunciado: "¿Qué es el 'Secure Boot' en UEFI?", opciones: ["Un modo para jugar", "Una función que asegura que solo se cargue software de confianza al arrancar", "Un antivirus", "Un tipo de contraseña"], correcta: 1, feedback: ["No tiene que ver.","¡Exacto! Evita que un malware (rootkit) se inicie antes que Windows.","Previene, pero no analiza archivos.","No es una clave de usuario."]},
                    {enunciado: "¿Qué componente conecta periféricos lentos como USB y audio en chipsets antiguos?", opciones: ["Puente Norte", "Puente Sur (Southbridge)", "Socket", "VRM"], correcta: 1, feedback: ["Conectaba CPU, RAM y GPU (ya está integrado en la CPU actual).","¡Sí! Gestionaba discos, USB y E/S. Hoy todo suele estar en un único chip.","Zócalo de CPU.","Suministro eléctrico."]},
                    {enunciado: "¿Cómo se accede normalmente a la BIOS/UEFI?", opciones: ["Desde Windows Update", "Pulsando una tecla (Supr, F2) durante el primer segundo de arranque", "Con un comando de voz", "Abriendo la caja"], correcta: 1, feedback: ["No desde ahí.","¡Correcto! Hay que ser rápido antes de que empiece a cargar Windows.","Aún no existe eso.","No es físico."]},
                    {enunciado: "¿Qué es el Clear CMOS?", opciones: ["Limpiar el polvo de la placa", "Resetear los ajustes de la BIOS a fábrica", "Formatear el SSD", "Actualizar drivers"], correcta: 1, feedback: ["Limpieza física.","¡Exacto! Se hace puenteando unos pines o quitando la pila si te equivocas haciendo overclock.","No afecta a los datos de usuario.","Es de software."]},
                    {enunciado: "¿Para qué sirve el 'Boot Order' (Orden de arranque)?", opciones: ["Para limpiar los discos", "Para elegir en qué dispositivo buscar primero el SO (USB, SSD, DVD...)", "Para ordenar archivos", "Para acelerar la CPU"], correcta: 1, feedback: ["No borra nada.","¡Sí! Imprescindible para instalar Windows desde un pendrive.","Eso lo hace el explorador.","No afecta a la velocidad."]},
                    {enunciado: "¿Qué componente suministra energía estable a la CPU desde la placa base?", opciones: ["Chipset", "VRM (Módulo Regulador de Voltaje)", "Batería CMOS", "Puerto SATA"], correcta: 1, feedback: ["Controla datos.","¡Correcto! Convierte los 12V de la fuente a ~1.2V muy limpios para el procesador.","Solo guarda ajustes.","Es para discos."]},
                    {enunciado: "¿Cuál es el tamaño de placa base más pequeño (de los estándar)?", opciones: ["ATX", "Micro-ATX", "Mini-ITX", "E-ATX"], correcta: 2, feedback: ["Estándar normal (30x24cm).","Tamaño medio.","¡Exacto! Mide 17x17cm, ideal para PCs de salón diminutos.","Formato gigante para entusiastas."]},
                    {enunciado: "¿Qué se conecta habitualmente en una ranura PCIe x1?", opciones: ["GPU potente", "Tarjetas de red (Wi-Fi) o sonido básicas", "Memoria RAM", "Procesador"], correcta: 1, feedback: ["Requiere PCIe x16.","¡Sí! Al ser periféricos que no necesitan un ancho de banda bestial, usan la ranura corta.","Slot DIMM.","Socket."]

                "Tema 3: Procesadores y Memoria": [
                    {enunciado: "¿Cuál es el primer paso del ciclo de instrucción de la CPU?", opciones: ["Ejecutar (Execute)", "Decodificar (Decode)", "Buscar/Recoger (Fetch)", "Almacenar (Store)"], correcta: 2, feedback: ["Tercer paso.","Segundo paso.","¡Correcto! Primero tiene que ir a la memoria a 'buscar' la instrucción.","Último paso (opcional)."]},
                    {enunciado: "¿Qué significa 'litografía' en un procesador?", opciones: ["El peso del chip", "El tamaño de los transistores (medido en nanómetros)", "La marca del fabricante", "El tipo de caja"], correcta: 1, feedback: ["Son ligerísimos.","¡Exacto! A menos nanómetros (nm), caben más transistores, gastan menos y corren más.","Esa es la serigrafía.","Falso."]},
                    {enunciado: "¿Qué postula la Ley de Moore?", opciones: ["La CPU será el doble de grande", "El número de transistores en un chip se duplica cada dos años aprox.", "El precio sube siempre", "La RAM desaparecerá"], correcta: 1, feedback: ["Siguen siendo del mismo tamaño exterior.","¡Sí! Gordon Moore lo predijo en 1965 y ha marcado el ritmo de la tecnología durante décadas.","A veces baja por la producción en masa.","Imposible."]},
                    {enunciado: "¿Qué arquitectura usa instrucciones complejas y es la base de Intel/AMD en PCs?", opciones: ["RISC", "CISC (x86)", "ARM", "MIPS"], correcta: 1, feedback: ["Reduced Instruction Set Computer.","¡Correcto! Complex Instruction Set Computer. Hace tareas complejas en un solo ciclo de reloj.","Es RISC.","Es RISC."]},
                    {enunciado: "¿Qué arquitectura usa instrucciones simples, consume poca batería y es común en móviles (ARM)?", opciones: ["CISC", "RISC", "Intel Core", "SATA"], correcta: 1, feedback: ["Es para PC.","¡Exacto! Al ser instrucciones más simples, el chip es más eficiente.","Son CISC x86.","Es de discos."]},
                    {enunciado: "Ordena las memorias caché de menor a mayor tamaño (capacidad):", opciones: ["L1 < L2 < L3", "L3 < L2 < L1", "L2 < L1 < L3", "L1 < L3 < L2"], correcta: 0, feedback: ["¡Correcto! La L1 es enana (unos KB), la L2 mediana, y la L3 más grande (MB) y compartida.","Al revés.","Orden incorrecto.","Orden incorrecto."]},
                    {enunciado: "¿Qué caché es la más rápida y cercana al núcleo del procesador?", opciones: ["L1", "L2", "L3", "RAM"], correcta: 0, feedback: ["¡Sí! Level 1. Va a la misma velocidad que el procesador.","Un poco más lenta.","Más lenta, pero la más grande.","Muy lenta comparada con la caché."]},
                    {enunciado: "¿Qué tipo de memoria RAM se usa actualmente en PCs modernos?", opciones: ["SDR", "DDR4 / DDR5", "EDO RAM", "SIMM"], correcta: 1, feedback: ["Antiquísima.","¡Correcto! Double Data Rate. DDR5 es el estándar actual más rápido.","De la época de los Pentium 1.","Formato obsoleto."]},
                    {enunciado: "¿Qué memoria es más rápida que la RAM pero con mucha menos capacidad?", opciones: ["SSD", "HDD", "Caché", "DVD"], correcta: 2, feedback: ["Es más lento que la RAM.","Lentísimo.","¡Exacto! Está dentro de la propia CPU para evitar cuellos de botella con la RAM.","Almacenamiento óptico."]},
                    {enunciado: "¿Para qué sirve el 'Overclocking'?", opciones: ["Para ahorrar energía", "Para aumentar la velocidad de reloj (GHz) por encima del valor de fábrica", "Para limpiar el registro", "Para enfriar el PC"], correcta: 1, feedback: ["Gasta mucha más energía.","¡Sí! Se gana rendimiento, pero a cambio se genera muchísimo más calor.","Eso es software (Ccleaner).","Todo lo contrario, lo calienta."]},
                    {enunciado: "¿Qué es el TDP (Thermal Design Power) de una CPU?", opciones: ["Su potencia de cálculo", "El calor máximo que genera y debe disiparse (en Vatios)", "El tamaño en mm", "La cantidad de RAM"], correcta: 1, feedback: ["Se mide en FLOPS o MIPS.","¡Correcto! Si compras una CPU de 105W TDP, necesitas un disipador capaz de enfriar 105W.","Eso es la litografía.","Se mide en GB."]},
                    {enunciado: "¿Qué hace la CPU en el paso de 'Decodificación'?", opciones: ["Recoger datos de internet", "Entender qué operación debe realizar ('traducir' la instrucción)", "Sumar dos números", "Guardar en el disco"], correcta: 1, feedback: ["Eso es red.","¡Sí! La Unidad de Control lee los ceros y unos y determina si es una suma, un salto, etc.","Eso es la Ejecución.","Eso es Store."]},
                    {enunciado: "¿Qué permite el Hyper-Threading (Intel) o SMT (AMD)?", opciones: ["Que la CPU use menos RAM", "Que un núcleo físico gestione dos hilos de ejecución simultáneos", "Que el PC no haga ruido", "Que el SSD sea más rápido"], correcta: 1, feedback: ["No afecta al uso de RAM.","¡Correcto! Hace que el SO crea que hay el doble de núcleos, aprovechando tiempos muertos.","Depende de los ventiladores.","No afecta a discos."]},
                    {enunciado: "¿Qué ocurre con el precio por GB según bajamos en la jerarquía de memoria (de Registros hacia HDD)?", opciones: ["Aumenta", "Disminuye significativamente", "Se mantiene igual", "Es aleatorio"], correcta: 1, feedback: ["La caché es la más cara.","¡Exacto! 1TB de HDD cuesta unos 40€; 1TB de caché costaría millones (y sería imposible).","Varía muchísimo.","Sigue una pirámide de costes estricta."]},
                    {enunciado: "¿Qué memoria está integrada directamente en el silicio (chip) de la CPU?", opciones: ["RAM", "Caché", "BIOS", "Virtual"], correcta: 1, feedback: ["Va en placas externas (DIMM).","¡Sí! Las cachés L1, L2 y L3 viven físicamente junto a los núcleos para minimizar la latencia.","Es un chip en la placa base.","Usa el disco duro."]},
                    {enunciado: "¿Qué indica el número de núcleos (cores) de una CPU?", opciones: ["La cantidad de RAM soportada", "La capacidad de procesar tareas de forma verdaderamente paralela", "La edad del procesador", "El número de ventiladores"], correcta: 1, feedback: ["Depende del controlador de memoria.","¡Correcto! 8 núcleos pueden hacer 8 cosas distintas exactamente a la misma vez.","No tiene relación.","Falso."]},
                    {enunciado: "¿Qué es la memoria RAM 'Dual Channel'?", opciones: ["Tener dos marcas distintas", "Usar dos módulos pares para duplicar el ancho de banda con el procesador", "Instalar RAM en el disco duro", "Tener dos sistemas operativos"], correcta: 1, feedback: ["Mejor usar módulos idénticos.","¡Sí! Al poner dos sticks de 8GB (en lugar de uno de 16GB), la CPU lee los dos a la vez.","Eso es memoria virtual/swap.","Eso es Dual Boot."]},
                    {enunciado: "¿Qué mide la latencia CAS (CL) de una memoria RAM?", opciones: ["La velocidad de reloj", "El tiempo (ciclos) que tarda en responder a una solicitud de la CPU", "El color del módulo", "La capacidad en GB"], correcta: 1, feedback: ["Se mide en MHz o MT/s.","¡Correcto! Menor CL significa que es más reactiva (ej. CL16 es mejor que CL18).","No afecta.","Ese es el tamaño."]},
                    {enunciado: "¿Qué tecnología / arquitectura usa Apple en sus modernos chips M1, M2 y M3?", opciones: ["CISC", "RISC (basada en ARM)", "x86", "PATA"], correcta: 1, feedback: ["No, abandonaron Intel.","¡Exacto! Dieron un salto brutal en eficiencia energética pasándose a arquitectura ARM.","Era la de Intel.","Cable de disco antiguo."]},
                    {enunciado: "¿Qué componente de hardware es responsable de ejecutar continuamente el ciclo Fetch-Decode-Execute?", opciones: ["RAM", "GPU", "CPU (Procesador)", "Chipset"], correcta: 2, feedback: ["Almacena datos, no ejecuta.","Procesa gráficos en paralelo.","¡Sí! Es el latido constante del corazón del ordenador.","Enruta información."]
                    }

                "Tema 4: Montaje, Seguridad y Mantenimiento Físico": [
                    {enunciado: "¿Qué es la ESD?", opciones: ["Un tipo de disco", "Descarga Electrostática (ElectroStatic Discharge) que fríe circuitos invisibles", "Un programa de montaje", "Una placa base"], correcta: 1, feedback: ["Eso es SSD.","¡Correcto! Esa 'chispa' inofensiva para humanos puede destruir una CPU al instante.","Falso.","Falso."]},
                    {enunciado: "¿Para qué sirve la pulsera antiestática?", opciones: ["Por moda", "Para igualar el potencial eléctrico entre tú y la caja del PC", "Para sujetar componentes", "Para medir temperaturas"], correcta: 1, feedback: ["No es un accesorio estético.","¡Sí! Se pinza a la chapa metálica de la torre y deriva tu electricidad estática a tierra.","No sujeta nada.","No mide."]},
                    {enunciado: "¿Dónde debe aplicarse la pasta térmica?", opciones: ["En las ranuras RAM", "Sobre el IHS (chapa superior) del procesador", "En los pines del socket", "Debajo de la placa"], correcta: 1, feedback: ["Destrozarías la RAM.","¡Correcto! Una pequeña gota en el centro (o una X) es suficiente.","Nunca ensucies los pines, arruinarás la placa base.","Falso."]},
                    {enunciado: "¿Cuál es la función exacta de la pasta térmica?", opciones: ["Pegar el procesador", "Rellenar microporos eliminando burbujas de aire térmicamente aislantes", "Aislar de la electricidad", "Decorar"], correcta: 1, feedback: ["No es pegamento, es un compuesto viscoso.","¡Exacto! El aire es mal conductor del calor; la pasta rellena los huecos microscópicos entre CPU y disipador.","Su fin es térmico, de hecho, algunas son conductoras eléctricas (peligro).","No se ve desde fuera."]},
                    {enunciado: "¿Qué marca indica la orientación correcta de la CPU en el socket?", opciones: ["Una pegatina", "Un pequeño triángulo o punto dorado en una esquina", "El código de barras", "Una flecha roja"], correcta: 1, feedback: ["No se ponen pegatinas ahí.","¡Sí! Se alinea el triangulito del procesador con el triangulito grabado en la placa base.","No indica posición.","Suele ser dorado."]},
                    {enunciado: "¿Cómo se debe instalar un módulo de memoria RAM?", opciones: ["Con pegamento", "Alineando la muesca asimétrica y presionando firme en ambos extremos hasta el 'clic'", "Arrastrándola", "Sin hacer presión"], correcta: 1, feedback: ["¡Nunca!","¡Correcto! Las pestañas laterales se cerrarán solas si haces la fuerza adecuada.","Destrozarías los contactos.","Requiere bastante fuerza (con cuidado)."]},
                    {enunciado: "¿Qué son los 'standoffs' o separadores dorados de la caja?", opciones: ["Tornillos de disco", "Piezas que elevan la placa base para que sus soldaduras no toquen la chapa metálica", "Mini ventiladores", "Adornos"], correcta: 1, feedback: ["Tienen otra rosca.","¡Exacto! Si atornillas la placa directo a la torre, crearás un cortocircuito que lo quemará todo.","Falso.","Son funcionales."]},
                    {enunciado: "¿Qué factor de forma es el más común en torres estándar de PC de sobremesa?", opciones: ["Mini-ITX", "ATX", "SFX", "BTX"], correcta: 1, feedback: ["Cubo muy pequeño.","¡Sí! Advanced Technology eXtended (30.5 cm × 24.4 cm), el estándar por excelencia.","Fuente de alimentación pequeña.","Formato fallido/antiguo."]},
                    {enunciado: "¿Qué suele indicar una luz LED fija en la placa base (Debug LED) o pitidos largos al encender?", opciones: ["Todo va bien", "Fallo crítico en algún componente (CPU, RAM, VGA o Boot)", "Modo turbo", "Descargando updates"], correcta: 1, feedback: ["No haría pitidos largos.","¡Correcto! Es el sistema POST avisando de que algo impide el arranque normal.","Falso.","No ha cargado aún ni la BIOS."]},
                    {enunciado: "¿Por qué es críticamente importante la gestión de cables (Cable Management)?", opciones: ["Principalmente para no obstruir el flujo de aire fresco", "Para que el PC pese menos", "Para ahorrar electricidad", "No importa"], correcta: 0, feedback: ["¡Exacto! Aparte de quedar bonito, evita que se formen 'bolsas de aire caliente' en la torre.","El peso es el mismo.","No afecta al consumo.","Importa mucho en PCs gaming/potentes."]},
                    {enunciado: "¿Qué herramienta es el 'Santo Grial' del montaje de ordenadores?", opciones: ["Martillo", "Destornillador de estrella (Phillips #2) magnetizado", "Llave inglesa", "Alicates"], correcta: 1, feedback: ["Solo para destruir.","¡Sí! Con un PH2 y unas bridas puedes montar el 99% de un PC moderno.","Los tornillos son pequeños.","Poco precisos."]},
                    {enunciado: "¿Qué es el I/O Shield (Chapa trasera)?", opciones: ["Tarjeta de red", "La chapa metálica embellecedora y protectora para los puertos USB/Audio de la placa", "Un ventilador", "Protector de RAM"], correcta: 1, feedback: ["No procesa.","¡Correcto! Si te olvidas de ponerla antes de atornillar la placa, tendrás que desmontar todo el PC.","Falso.","Falso."]},
                    {enunciado: "¿Cuándo es más cómodo instalar el disipador de aire de la CPU?", opciones: ["Antes de poner la CPU", "Fuera de la caja, tras anclar la CPU y aplicar la pasta en la placa base", "Con la placa ya metida y atornillada al fondo", "Nunca"], correcta: 1, feedback: ["Físicamente imposible.","¡Exacto! Instalar bloque de CPU, RAM y disipador/bomba encima de una mesa es mucho más fácil.","Suele faltar espacio para meter las manos.","Se fundiría."]},
                    {enunciado: "¿Qué se debe hacer si un PC recién montado no da señal de vídeo al pulsar 'Power'?", opciones: ["Tirarlo", "Mantener la calma, apagar, y revisar conexiones de RAM, CPU y cables de alimentación", "Cambiar Windows", "Darle un golpe"], correcta: 1, feedback: ["Mala idea.","¡Sí! El 80% de las veces es un cable EPS de CPU olvidado o una RAM mal encajada.","No ha llegado a Windows.","Romperás el disco."]},
                    {enunciado: "¿Dónde se conectan los minúsculos cables del botón de encendido y LEDs frontales de la caja?", opciones: ["SATA", "En los pines F_PANEL (Front Panel) de la placa base", "En el zócalo", "En el USB"], correcta: 1, feedback: ["Para discos.","¡Correcto! Hay que mirar muy bien el manual de la placa para ver dónde va el PWR_SW (Power Switch).","Socket.","Falso."]},
                    {enunciado: "¿Qué componente suministra energía a toda la placa base mediante un gran conector de 24 pines?", opciones: ["CPU", "Fuente de alimentación (PSU)", "Batería CMOS", "UPS"], correcta: 1, feedback: ["La recibe, no la da.","¡Sí! El conector ATX 24-pin es el cable más gordo de la fuente de alimentación.","Mantiene la hora.","Da corriente externa."]},
                    {enunciado: "¿Cómo se debe agarrar siempre una placa base nueva al sacarla de su bolsa antiestática?", opciones: ["Por los chips del medio", "Por los bordes exteriores y los conectores plásticos grandes", "Por el reverso lleno de pines", "Con guantes de lana"], correcta: 1, feedback: ["Peligro de estática y grasa.","¡Exacto! Evita tocar soldaduras, circuitos expuestos o los pines del zócalo.","Te pincharás y mancharás pistas.","La lana genera muchísima electricidad estática."]},
                    {enunciado: "¿Qué es la refrigeración líquida AIO (All-In-One)?", opciones: ["Echar agua a la placa", "Un sistema sellado de fábrica con bloque de agua, mangueras y radiador", "Ventilador mojado", "Sumergir en aceite"], correcta: 1, feedback: ["Cortocircuito.","¡Sí! No requiere mantenimiento de llenado y enfría las CPUs más potentes disipando el calor lejos.","No.","Eso existe, pero no es AIO."]},
                    {enunciado: "¿Qué indica obligatoriamente el manual de la placa base sobre la instalación de la RAM?", opciones: ["El precio sugerido", "En qué ranuras exactas (ej. A2 y B2) colocarlas para activar el Dual Channel", "Cómo descargar RAM de internet", "El color de los LEDs"], correcta: 1, feedback: ["Falso.","¡Correcto! Si pones los dos módulos juntos en A1 y A2 funcionarán a la mitad de ancho de banda.","Eso es un meme, la RAM es física.","Falso."]},
                    {enunciado: "¿Qué precaución básica debes tomar antes de manipular el interior del PC?", opciones: ["Encenderlo", "Apagar la fuente en el interruptor [O] y desconectar el cable de la pared", "Tener las manos mojadas", "No hacer nada especial"], correcta: 1, feedback: ["Peligro de electrocución.","¡Exacto! Incluso apagado, la placa recibe 5V de energía de espera (Standby) que puede provocar cortos.","Riesgo fatal.","Malas prácticas."]
                    }

                "Tema 5: Periféricos, Puertos y Conectividad": [
                    {enunciado: "¿Qué tecnología combina datos a alta velocidad, salida de vídeo y carga en un conector tipo USB-C?", opciones: ["HDMI", "Thunderbolt 3 / 4", "VGA", "SATA"], correcta: 1, feedback: ["Solo vídeo y audio.","¡Correcto! Es un estándar de Intel/Apple extremadamente versátil (hasta 40Gbps).","Vídeo analógico antiguo.","Discos internos."]},
                    {enunciado: "¿Cuál es la velocidad de ancho de banda máxima de Thunderbolt 4?", opciones: ["10 Gbps", "40 Gbps", "100 Gbps", "5 Gbps"], correcta: 1, feedback: ["Velocidad de USB 3.1.","¡Sí! Permite conectar gráficas externas o monitores 4K sin despeinarse.","Aún no.","USB 3.0 básico."]},
                    {enunciado: "¿Qué periférico interno es fundamental para procesar gráficos 3D masivos y entrenar IA?", opciones: ["Tarjeta de sonido", "GPU (Tarjeta gráfica dedicada)", "Escáner", "Módem"], correcta: 1, feedback: ["Procesa audio.","¡Correcto! Con sus miles de pequeños núcleos, es experta en cálculos matriciales en paralelo.","Periférico de entrada de imagen.","Conexión telefónica."]},
                    {enunciado: "¿Qué conectores se usan habitualmente para monitores digitales modernos en PCs?", opciones: ["PS/2 y serie", "HDMI y DisplayPort", "COM1 y LPT1", "SATA y NVMe"], correcta: 1, feedback: ["Para teclado/ratón antiguos.","¡Sí! Transmiten vídeo y audio digital de alta resolución sin pérdida.","Puertos serie/paralelo antiguos.","Almacenamiento."]},
                    {enunciado: "¿Qué protocolo de software aprovecha el bus PCIe para que los SSD vuelen?", opciones: ["USB", "NVMe (Non-Volatile Memory express)", "SATA", "IDE"], correcta: 1, feedback: ["Puertos externos.","¡Correcto! Diseñado específicamente para evitar el cuello de botella de la vieja interfaz SATA.","Límite mecánico antiguo.","Cintas grises de los 90."]},
                    {enunciado: "¿Cómo se llama el conector físico para conectar el PC a la red/internet por cable?", opciones: ["USB", "RJ-45 (Ethernet)", "SATA", "Jack 3.5"], correcta: 1, feedback: ["Datos generales.","¡Sí! El clásico puerto cuadrado de red para conexiones LAN y routers.","Discos.","Audio."]},
                    {enunciado: "¿Qué es un periférico de Entrada (Input)?", opciones: ["Monitor", "Teclado / Ratón", "Impresora", "Altavoces"], correcta: 1, feedback: ["Salida de vídeo.","¡Correcto! Introducen datos desde el humano hacia la CPU.","Salida física.","Salida de audio."]},
                    {enunciado: "¿Qué es un periférico de Salida (Output)?", opciones: ["Ratón", "Escáner", "Monitor / Impresora", "Micrófono"], correcta: 2, feedback: ["Entrada de movimiento.","Entrada de imagen.","¡Exacto! El PC te devuelve la información ya procesada (luz, tinta, sonido).","Entrada de voz."]},
                    {enunciado: "¿Qué ventaja clave tiene DisplayPort sobre HDMI en entornos informáticos?", opciones: ["Es más barato", "Soporta mayores tasas de refresco (Hz) y múltiples monitores en cadena (Daisy Chain)", "No transmite audio", "Es analógico"], correcta: 1, feedback: ["Coste similar.","¡Sí! Es el favorito de los gamers para monitores de 144Hz o 240Hz.","Ambos lo hacen.","Es 100% digital."]},
                    {enunciado: "¿Para qué sirve una interfaz/tarjeta de sonido dedicada hoy en día?", opciones: ["Para que el PC arranque", "Para creación de audio profesional, reducir latencia y usar micrófonos XLR", "Para acelerar los FPS", "Para el teclado"], correcta: 1, feedback: ["No es obligatoria.","¡Correcto! Las tarjetas integradas son buenas para el usuario base, pero no para un estudio de música.","La GPU da los FPS.","No tiene sentido."]},
                    {enunciado: "¿Qué significa la característica 'Hot Plug' o conexión en caliente?", opciones: ["Peligro de quemaduras", "Poder conectar y desconectar un dispositivo (ej. pendrive) sin tener que reiniciar el equipo", "Un virus térmico", "Un cable con resistencia"], correcta: 1, feedback: ["Falso.","¡Exacto! Antiguamente, poner un teclado PS/2 requería apagar el PC por completo.","Falso.","Falso."]},
                    {enunciado: "¿Qué conector físico unificado usan Thunderbolt 3/4 y USB4?", opciones: ["USB Type-A (rectangular)", "USB Type-C (reversible)", "Mini-HDMI", "Firewire"], correcta: 1, feedback: ["El clásico que nunca entra a la primera.","¡Sí! La maravilla ovalada que se puede conectar de ambos lados.","Vídeo solo.","Antiguo de Apple/Sony."]},
                    {enunciado: "¿Qué diferencia práctica hay entre un ratón óptico y uno láser?", opciones: ["El color de la carcasa", "El láser funciona sobre cristal y superficies muy pulidas donde el óptico (LED) falla", "La batería dura años", "Tienen más botones"], correcta: 1, feedback: ["Estética.","¡Correcto! El láser tiene mucha más precisión en superficies reflectantes.","Depende de la pila.","Depende del modelo."]},
                    {enunciado: "¿Qué es una GPU o gráfica 'Integrada' (iGPU)?", opciones: ["Una tarjeta enorme", "Un chip gráfico básico que viene dentro de la propia CPU (ej. Intel UHD, AMD Radeon)", "Un monitor con PC", "No existe"], correcta: 1, feedback: ["Esa es la Dedicada.","¡Sí! Ideal para ofimática y portátiles baratos, ya que no requiere ventilador propio y gasta poco.","Eso es un All-in-One.","Sí existe."]},
                    {enunciado: "¿Qué interfaz física usa una tarjeta de red 10GbE profesional para encajar en la placa?", opciones: ["USB 2.0", "Ranura PCIe", "Cable SATA", "Puerto VGA"], correcta: 1, feedback: ["No da ancho de banda.","¡Correcto! Las tarjetas de expansión modernas van pinchadas en el bus PCI Express.","Interno para discos.","Vídeo."]},
                    {enunciado: "¿Qué indica el pequeño logo de un rayo impreso junto a un puerto USB-C en un portátil?", opciones: ["Carga del móvil", "Que es un puerto Thunderbolt y soporta funciones avanzadas", "Riesgo de electrocución", "Que es USB 2.0 lento"], correcta: 1, feedback: ["El símbolo de batería es para carga.","¡Exacto! Sin el rayo, podría ser solo un USB-C básico de datos (USB 3.2 gen 1).","Falso.","Falso."]},
                    {enunciado: "¿Qué periférico analógico a digital permite introducir documentos físicos al PC?", opciones: ["Impresora", "Escáner", "Tableta gráfica", "Plotter"], correcta: 1, feedback: ["Digital a analógico.","¡Sí! Toma un folio y lo convierte en un PDF o imagen.","Para dibujar.","Impresora gigante."]},
                    {enunciado: "¿Qué es un teclado mecánico?", opciones: ["El de máquinas de escribir", "Tiene un interruptor (switch) físico individual bajo cada tecla, en vez de membrana de goma", "Uno que funciona a poleas", "Un teclado virtual"], correcta: 1, feedback: ["Falso.","¡Correcto! Tienen mejor tacto, duran 50 millones de pulsaciones y hacen un 'clic' característico.","Falso.","Software."]},
                    {enunciado: "¿Qué tipo de panel LCD de monitor ofrece los colores más reales y los mejores ángulos de visión?", opciones: ["TN (Twisted Nematic)", "IPS (In-Plane Switching)", "Pantalla CRT", "OLED"], correcta: 1, feedback: ["Rápido pero colores lavados.","¡Exacto! Los IPS son la elección obligada para diseñadores gráficos y fotografía.","Tubo de rayos catódicos.","OLED no es LCD, emite luz propia."]},
                    {enunciado: "¿Qué es el bus PCIe (PCI Express) en su base técnica?", opciones: ["Un cable de red Ethernet", "Un estándar de conexión de alta velocidad basado en 'líneas' (lanes) seriales (x1, x4, x8, x16)", "Una marca de memoria", "Software de Microsoft"], correcta: 1, feedback: ["Red LAN.","¡Sí! Cada línea (lane) transmite datos a altísima velocidad. Una gráfica usa 16 carriles a la vez.","Falso.","Hardware, no software."]
