                    {enunciado: "¿Qué conectores se usan habitualmente para monitores digitales modernos en PCs?", opciones: ["PS/2 y serie", "HDMI y DisplayPort", "COM1 y LPT1", "SATA y NVMe"], correcta: 1, feedback: ["Para teclado/ratón antiguos.","¡Sí! Transmiten vídeo y audio digital de alta resolución sin pérdida.","Puertos serie/paralelo antiguos.","Almacenamiento."]},
                    {enunciado: "¿Qué protocolo de software aprovecha el bus PCIe para que los SSD vuelen?", opciones: ["USB", "NVMe (Non-Volatile Memory express)", "SATA", "IDE"], correcta: 1, feedback: ["Puertos externos.","¡Correcto! Diseñado específicamente para evitar el cuello de botella de la vieja interfaz SATA.","Límite mecánico antiguo.","Cintas grises de los 90."]},

                    {enunciado: "¿Qué es un periférico de Salida (Output)?", opciones: ["Ratón", "Escáner", "Monitor / Impresora", "Micrófono"], correcta: 2, feedback: ["Entrada de movimiento.","Entrada de imagen.","¡Exacto! El PC te devuelve la información ya procesada (luz, tinta, sonido).","Entrada de voz."]},
                    {enunciado: "¿Qué ventaja clave tiene DisplayPort sobre HDMI en entornos informáticos?", opciones: ["Es más barato", "Soporta mayores tasas de refresco (Hz) y múltiples monitores en cadena (Daisy Chain)", "No transmite audio", "Es analógico"], correcta: 1, feedback: ["Coste similar.","¡Sí! Es el favorito de los gamers para monitores de 144Hz o 240Hz.","Ambos lo hacen.","Es 100% digital."]},
                    {enunciado: "¿Para qué sirve una interfaz/tarjeta de sonido dedicada hoy en día?", opciones: ["Para que el PC arranque", "Para creación de audio profesional, reducir latencia y usar micrófonos XLR", "Para acelerar los FPS", "Para el teclado"], correcta: 1, feedback: ["No es obligatoria.","¡Correcto! Las tarjetas integradas son buenas para el usuario base, pero no para un estudio de música.","La GPU da los FPS.","No tiene sentido."]},
                    {enunciado: "¿Qué significa la característica 'Hot Plug' o conexión en caliente?", opciones: ["Peligro de quemaduras", "Poder conectar y desconectar un dispositivo (ej. pendrive) sin tener que reiniciar el equipo", "Un virus térmico", "Un cable con resistencia"], correcta: 1, feedback: ["Falso.","¡Exacto! Antiguamente, poner un teclado PS/2 requería apagar el PC por completo.","Falso.","Falso."]},
                    {enunciado: "¿Qué conector físico unificado usan Thunderbolt 3/4 y USB4?", opciones: ["USB Type-A (rectangular)", "USB Type-C (reversible)", "Mini-HDMI", "Firewire"], correcta: 1, feedback: ["El clásico que nunca entra a la primera.","¡Sí! La maravilla ovalada que se puede conectar de ambos lados.","Vídeo solo.","Antiguo de Apple/Sony."]},
                    {enunciado: "¿Qué diferencia práctica hay entre un ratón óptico y uno láser?", opciones: ["El color de la carcasa", "El láser funciona sobre cristal y superficies muy pulidas donde el óptico (LED) falla", "La batería dura años", "Tienen más botones"], correcta: 1, feedback: ["Estética.","¡Correcto! El láser tiene mucha más precisión en superficies reflectantes.","Depende de la pila.","Depende del modelo."]},
                    {enunciado: "¿Qué es una GPU o gráfica 'Integrada' (iGPU)?", opciones: ["Una tarjeta enorme", "Un chip gráfico básico que viene dentro de la propia CPU (ej. Intel UHD, AMD Radeon)", "Un monitor con PC", "No existe"], correcta: 1, feedback: ["Esa es la Dedicada.","¡Sí! Ideal para ofimática y portátiles baratos, ya que no requiere ventilador propio y gasta poco.","Eso es un All-in-One.","Sí existe."]},
                    {enunciado: "¿Qué interfaz física usa una tarjeta de red 10GbE profesional para encajar en la placa?", opciones: ["USB 2.0", "Ranura PCIe", "Cable SATA", "Puerto VGA"], correcta: 1, feedback: ["No da ancho de banda.","¡Correcto! Las tarjetas de expansión modernas van pinchadas en el bus PCI Express.","Interno para discos.","Vídeo."]},

                    {enunciado: "¿Qué periférico analógico a digital permite introducir documentos físicos al PC?", opciones: ["Impresora", "Escáner", "Tableta gráfica", "Plotter"], correcta: 1, feedback: ["Digital a analógico.","¡Sí! Toma un folio y lo convierte en un PDF o imagen.","Para dibujar.","Impresora gigante."]},
                    {enunciado: "¿Qué es un teclado mecánico?", opciones: ["El de máquinas de escribir", "Tiene un interruptor (switch) físico individual bajo cada tecla, en vez de membrana de goma", "Uno que funciona a poleas", "Un teclado virtual"], correcta: 1, feedback: ["Falso.","¡Correcto! Tienen mejor tacto, duran 50 millones de pulsaciones y hacen un 'clic' característico.","Falso.","Software."]},

                "Tema 6: Almacenamiento y RAID": [
                    {enunciado: "¿Cuáles son los tres tipos principales de unidades de almacenamiento interno?", opciones: ["HDD, SSD y NVMe", "RAM, ROM y Caché", "CD, DVD y Blu-ray", "USB, SD y microSD"], correcta: 0, feedback: ["¡Correcto! Discos mecánicos, discos de estado sólido y el protocolo más rápido actual.", "Son memorias de trabajo del sistema, no almacenamiento masivo.", "Son formatos ópticos que ya están en desuso.", "Son formatos portátiles externos."]},
                    {enunciado: "¿Qué interfaz es estándar para servidores de alta gama por su robustez y fiabilidad?", opciones: ["SATA", "SAS (Serial Attached SCSI)", "PATA", "USB"], correcta: 1, feedback: ["SATA es el estándar para ordenadores domésticos.", "¡Sí! Los discos SAS giran más rápido (15K RPM) y están diseñados para trabajar 24/7 sin fallar.", "Estándar antiguo de cables planos anchos.", "Es una conexión externa."]},
                    {enunciado: "¿Qué RAID suma capacidades y velocidad pero NO tiene tolerancia a fallos?", opciones: ["RAID 1", "RAID 0", "RAID 5", "RAID 10"], correcta: 1, feedback: ["RAID 1 es un espejo seguro.", "¡Correcto! El Striping divide los datos entre los discos (muy rápido), pero si uno se rompe, pierdes TODO.", "RAID 5 usa paridad para seguridad.", "RAID 10 combina velocidad y espejo."]},
                    {enunciado: "¿Qué RAID hace un 'espejo' exacto entre dos discos?", opciones: ["RAID 0", "RAID 1", "RAID 5", "JBOD"], correcta: 1, feedback: ["RAID 0 reparte los datos, no los duplica.", "¡Exacto! Mirroring. Si tienes dos discos de 1TB, solo tienes 1TB usable, pero si falla uno, el otro tiene todo.", "RAID 5 necesita mínimo 3 discos.", "Suma discos de distintos tamaños sin seguridad."]},
                    {enunciado: "¿Qué RAID usa paridad para permitir el fallo de un disco sin perder rendimiento total?", opciones: ["RAID 0", "RAID 1", "RAID 5", "RAID 0+1"], correcta: 2, feedback: ["Cero seguridad.", "Espejo puro, se desperdicia el 50% del espacio.", "¡Correcto! Guarda pedacitos matemáticos (paridad) repartidos. Si un disco muere, el sistema reconstruye los datos.", "Combinación compleja de 4 discos mínimo."]},
                    {enunciado: "¿Qué es un NAS?", opciones: ["Un tipo de disco duro", "Un servidor de archivos conectado a la red local", "Un protocolo de internet", "Un virus"], correcta: 1, feedback: ["El NAS contiene discos, pero no es el disco en sí.", "¡Sí! Network Attached Storage. Es un 'mini PC' con discos para compartir archivos y hacer backups en red.", "No es software.", "Falso."]},
                    {enunciado: "¿Por qué el disco duro mecánico (HDD) es más barato por GB?", opciones: ["Porque es más moderno", "Porque usa tecnología mecánica de platos magnéticos consolidada", "Porque es más pequeño", "Porque no usa electricidad"], correcta: 1, feedback: ["Al revés, es la tecnología más antigua.", "¡Correcto! Su fabricación masiva durante décadas hace que almacenar Terabytes ahí sea baratísimo.", "Físicamente suelen ser más grandes (3.5\").", "Todos consumen electricidad."]},
                    {enunciado: "¿Qué formato físico tienen los SSD M.2?", opciones: ["Una caja de 3.5 pulgadas", "Una pequeña tarjeta alargada similar a un chicle", "Un cable redondo", "Un cilindro"], correcta: 1, feedback: ["Ese es el disco duro mecánico de PC.", "¡Exacto! Se pinchan directamente en la placa base y no necesitan cables de datos ni de corriente.", "No son cables.", "Falso."]},
                    {enunciado: "¿Cuál es el principal punto débil del RAID 0?", opciones: ["Es lento", "Si un disco falla, se pierden todos los datos del conjunto", "Es muy caro", "Solo admite dos discos"], correcta: 1, feedback: ["Es el más rápido de todos.", "¡Sí! Al estar un archivo partido por la mitad entre dos discos, si muere uno, el archivo queda inservible.", "Cuesta lo mismo que valgan los discos.", "Admite más discos."]},
                    {enunciado: "¿Qué ventaja tiene el protocolo NVMe sobre el SATA?", opciones: ["Es más barato", "Mucho mayor ancho de banda al comunicarse directamente por el bus PCIe", "Es compatible con disqueteras", "No necesita placa base"], correcta: 1, feedback: ["Suele ser más caro.", "¡Correcto! SATA hace cuello de botella a ~600MB/s, NVMe supera los 7000MB/s fácilmente.", "Tecnologías incompatibles.", "Se conecta en la placa."]},
                    {enunciado: "¿Qué es la 'paridad' en un RAID 5?", opciones: ["Un tipo de cable", "Información matemática (XOR) que permite reconstruir datos perdidos si falla un disco", "Un disco vacío", "Una contraseña"], correcta: 1, feedback: ["No es hardware.", "¡Exacto! El sistema calcula qué dato falta haciendo una operación matemática con los discos supervivientes.", "Los datos ocupan espacio.", "No da seguridad de acceso."]},
                    {enunciado: "¿Es el RAID una copia de seguridad (Backup)?", opciones: ["Sí, la mejor", "No, solo protege ante fallos mecánicos de los discos", "Depende del precio", "Solo el RAID 0"], correcta: 1, feedback: ["Es un error gravísimo pensar esto.", "¡Correcto! Si entra un virus o borras un archivo por error, se borrará/infectará en todos los discos del RAID al instante.", "El concepto no varía por el coste.", "El RAID 0 es el menos seguro."]},
                    {enunciado: "¿Qué es el formato 2.5 pulgadas?", opciones: ["Un tipo de tornillo", "El tamaño estándar de discos para portátiles y SSDs SATA", "La longitud del cable", "Un monitor diminuto"], correcta: 1, feedback: ["No son tornillos.", "¡Sí! Es más pequeño que el bloque de 3.5\" tradicional de las torres de sobremesa.", "No mide cables.", "Falso."]},
                    {enunciado: "¿Qué sucede si borras un archivo accidentalmente en un RAID 1?", opciones: ["Se queda en el otro disco por si acaso", "Se borra en ambos simultáneamente (es un espejo a tiempo real)", "Se mueve a la nube", "No se puede borrar"], correcta: 1, feedback: ["Ojalá, pero no funciona así.", "¡Exacto! Por eso un RAID NO es un backup. Hace exactamente lo mismo en los dos discos a la vez.", "No tiene nube integrada.", "Cualquiera con permisos puede borrarlo."]},
                    {enunciado: "¿Cuál es el número mínimo de discos necesarios para montar un RAID 5?", opciones: ["Uno", "Dos", "Tres", "Cuatro"], correcta: 2, feedback: ["Imposible, no hay redundancia.", "Con dos solo puedes hacer RAID 0 o RAID 1.", "¡Correcto! Dos para dividir datos y uno para repartir la paridad matemática.", "El RAID 6 o el RAID 10 necesitan mínimo cuatro."]},
                    {enunciado: "¿Qué interfaz moderna es la evolución directa de los viejos discos PATA (IDE)?", opciones: ["SATA (Serial ATA)", "USB", "NVMe", "SCSI"], correcta: 0, feedback: ["¡Sí! Pasamos del cable plano 'Parallel' al cable delgado 'Serial'.", "Es para conectar periféricos externos.", "Es el protocolo para discos M.2.", "Es un estándar paralelo diferente para servidores antiguos."]},
                    {enunciado: "¿Para qué se usa principalmente un disco SAS?", opciones: ["Para jugar en casa a altos FPS", "Para entornos empresariales y servidores que funcionan 24/7", "Para cámaras de fotos", "Para el mando de la TV"], correcta: 1, feedback: ["Hace mucho ruido y no da más FPS.", "¡Correcto! Están hechos para soportar vibraciones extremas y no apagarse en años.", "Usan tarjetas SD.", "Usan pilas."]},
                    {enunciado: "¿Qué significa 'Hot Swapping' (Extracción en caliente)?", opciones: ["Que el disco se quema", "Cambiar un disco averiado por uno nuevo sin tener que apagar el servidor", "Formatear rápido", "Un tipo de RAID"], correcta: 1, feedback: ["Se refiere a la conexión, no a la temperatura real.", "¡Exacto! Vital en servidores: sacas el disco roto de su bahía frontal, metes uno nuevo y el RAID se reconstruye sin que los usuarios noten nada.", "Eso es el formato rápido.", "Es una característica física, no el RAID en sí."]},
                    {enunciado: "¿Qué es una unidad de almacenamiento híbrida (SSHD)?", opciones: ["Un disco que usa agua", "Un disco mecánico tradicional que incluye una pequeña memoria caché SSD interna", "Dos discos pegados con cinta", "Un SSD muy lento"], correcta: 1, feedback: ["Imposible.", "¡Sí! Aprende qué archivos usas más (ej. el arranque de Windows) y los mete en la parte SSD para que el PC vaya más rápido.", "No es un apaño manual.", "Es un disco mecánico acelerado."]},
                    {enunciado: "¿Qué es la memoria Flash NAND?", opciones: ["La base física de almacenamiento que usan los SSDs y pendrives", "Un tipo de RAM de los años 90", "Un cable especial", "Un software de copias"], correcta: 0, feedback: ["¡Correcto! Son celdas de memoria no volátil (guardan los electrones sin energía) organizadas en capas.", "Falso.", "No es un conector.", "Es hardware."]}

                "Tema 7: Centros de Proceso de Datos (CPD) y Servidores": [
                    {enunciado: "¿Qué caracteriza principalmente a un mainframe frente a un PC normal?", opciones: ["Es físicamente más pequeño", "Capacidad masiva de procesamiento de miles de transacciones simultáneas y fiabilidad extrema", "Es solo para jugar", "No usa electricidad"], correcta: 1, feedback: ["Son armarios enormes.", "¡Correcto! Los usan los bancos y aerolíneas para gestionar millones de operaciones sin caerse jamás.", "No tienen tarjeta gráfica 3D.", "Gasta muchísima."]},
                    {enunciado: "¿Qué caracteriza principalmente a un mainframe frente a un PC normal?", opciones: ["Es físicamente más pequeño", "Capacidad masiva de procesamiento de miles de transacciones simultáneas y fiabilidad extrema", "Es solo para jugar", "No usa electricidad"], correcta: 1, feedback: ["Son armarios enormes.", "¡Correcto! Los usan los bancos y aerolíneas para gestionar millones de operaciones sin caerse jamás.", "No tienen tarjeta gráfica 3D.", "Gasta muchísima."]},
                    {enunciado: "¿Qué es un CPD (Centro de Procesamiento de Datos o Data Center)?", opciones: ["Un programa de ordenador", "Una instalación física ultra-segura para alojar sistemas informáticos críticos de una empresa", "Una tienda de ordenadores", "Un tipo de cable de fibra"], correcta: 1, feedback: ["Es un edificio o sala.", "¡Sí! Un lugar con control de clima, seguridad y energía garantizada para los servidores.", "No venden al público.", "Utilizan mucha fibra, pero no lo son."]},
                    {enunciado: "¿Cómo se llama el armario metálico estandarizado donde se atornillan y apilan los servidores?", opciones: ["Caja fuerte", "Rack", "Estantería", "Maletero"], correcta: 1, feedback: ["Se parece, pero no.", "¡Exacto! Permite organizar los equipos de forma vertical ahorrando espacio.", "Es muy técnica para llamarla así.", "Es de coches."]},
                    {enunciado: "¿Cuál es el ancho estándar universal de un Rack?", opciones: ["10 pulgadas", "19 pulgadas", "50 centímetros", "1 metro"], correcta: 1, feedback: ["Demasiado estrecho.", "¡Correcto! Todos los servidores, switches y routers de empresa miden 19 pulgadas de ancho para encajar perfectamente.", "Medida incorrecta.", "Demasiado ancho."]},
                    {enunciado: "¿Qué mide la unidad 'U' (o RU) en un Rack?", opciones: ["La velocidad de la red", "La altura del equipo (1 U = 1.75 pulgadas o 4.44 cm)", "El peso máximo que soporta", "El consumo eléctrico"], correcta: 1, feedback: ["Se mide en Gbps.", "¡Sí! Si compras un servidor '2U', sabes que ocupará dos huecos verticales en el armario.", "Se mide en Kg.", "Se mide en Vatios/Amperios."]},
                    {enunciado: "¿Qué es la técnica de refrigeración por pasillos fríos y calientes?", opciones: ["Poner el aire acondicionado normal al máximo", "Optimización del flujo de aire orientando los servidores cara a cara y espalda con espalda", "Usar bloques de hielo en el CPD", "Abrir las ventanas del edificio"], correcta: 1, feedback: ["Eso desperdiciaría muchísima energía y dinero.", "¡Exacto! El aire frío sube por el pasillo central, entra por el frontal de los equipos y se expulsa caliente por detrás hacia los retornos.", "Agua y servidores no combinan bien.", "Entraría polvo y humedad."]},
                    {enunciado: "¿Qué significa tener 'redundancia energética' en un CPD?", opciones: ["Gastar mucha factura de la luz", "Tener varias fuentes de energía (SAI, generadores diésel) por si falla la red eléctrica principal", "Usar pilas normales", "No apagar nunca las luces de la sala"], correcta: 1, feedback: ["No va de gastar más, va de seguridad.", "¡Correcto! Si hay un apagón general, los servidores no pueden enterarse ni apagarse.", "No darían la potencia necesaria.", "Las luces dan igual."]},
                    {enunciado: "¿Qué es un SAI (Sistema de Alimentación Ininterrumpida) o UPS?", opciones: ["Un tipo de servidor web", "Un dispositivo lleno de baterías que da energía temporal para que los equipos no se apaguen de golpe", "Un cable de red cruzado", "Un ventilador gigante"], correcta: 1, feedback: ["No procesa datos.", "¡Sí! Filtra la corriente para que sea limpia y da unos minutos de vida si se va la luz, dando tiempo a encender el generador de gasoil.", "Es de red.", "Eso es el HVAC."]},
                    {enunciado: "¿En qué consiste la 'seguridad física' en un CPD?", opciones: ["Poner buenos antivirus", "Cámaras, guardias, biometría y control estricto de acceso al edificio", "Instalar Firewalls de red", "Poner contraseñas difíciles"], correcta: 1, feedback: ["Eso es seguridad lógica (software).", "¡Exacto! De nada sirve un buen Firewall si alguien puede entrar caminando y robarte el disco duro con las manos.", "Seguridad lógica.", "Seguridad lógica."]},
                    {enunciado: "¿Qué es la 'seguridad lógica'?", opciones: ["Poner candados en el rack", "Cifrado de datos, firewalls, antivirus y gestión de permisos de usuario", "Limpiar el polvo", "Cerrar la puerta con llave"], correcta: 1, feedback: ["Seguridad física.", "¡Sí! Todas las barreras invisibles a nivel de software y redes para evitar hackeos.", "Mantenimiento.", "Seguridad física."]},
                    {enunciado: "¿Qué gran diferencia hay entre un servidor y un PC doméstico en cuanto a la memoria RAM?", opciones: ["El servidor usa RAM más barata", "El servidor usa memoria ECC (Error-Correcting Code) que detecta y corrige fallos sobre la marcha", "El servidor no usa RAM, va directo al disco", "Usan exactamente la misma"], correcta: 1, feedback: ["Suele ser mucho más cara.", "¡Correcto! Un bit volteado por radiación cósmica en tu PC cuelga un juego; en un banco, podría borrar un millón de euros. La ECC lo evita.", "Imposible funcionar sin RAM.", "No, las placas domésticas a veces ni soportan ECC."]},
                    {enunciado: "¿Qué es la 'monitorización' en un CPD?", opciones: ["Mirar Netflix en las pantallas", "Vigilancia por software constante (24/7) de temperatura, carga de CPU, discos y energía", "Jugar online", "Instalar Windows muchas veces"], correcta: 1, feedback: ["No es un cine.", "¡Exacto! Los administradores tienen paneles (Dashboards) que avisan con alertas rojas antes de que un servidor se caiga.", "No en horario de trabajo.", "Es una tarea de sistema."]},
                    {enunciado: "¿Qué es un sistema de extinción de incendios por gas (ej. Novec o Argón)?", opciones: ["Los aspersores de agua del techo", "Usar gases que ahogan el fuego desplazando el oxígeno sin mojar ni dañar la electrónica", "Soplar muy fuerte", "No se puede apagar un fuego en un CPD"], correcta: 1, feedback: ["El agua destruiría todos los servidores.", "¡Sí! Salta una alarma y la sala se inunda de un gas que apaga el fuego en segundos sin dejar ningún residuo.", "Poco efectivo.", "Por supuesto que se puede y se debe."]},
                    {enunciado: "¿Para qué sirve tener un 'suelo técnico' falso elevado?", opciones: ["Para que quede bonito y elegante", "Para pasar todos los mazos de cables por debajo y canalizar el aire frío a presión hacia los racks", "Para amortiguar si se cae algo", "Para ahorrar cemento en la obra"], correcta: 1, feedback: ["La estética da igual en el CPD.", "¡Correcto! Las baldosas del suelo están perforadas justo delante de los servidores para que salga el frío.", "No rebotan.", "Es mucho más caro de construir."]},
                    {enunciado: "¿Qué significa la 'criticidad' de un negocio o sistema?", opciones: ["Lo mucho que se quejan los clientes", "El impacto vital que tendría para la empresa que ese sistema se cayera (pérdida de dinero/vidas)", "El precio que costó el servidor", "La velocidad de la conexión a internet"], correcta: 1, feedback: ["No va de críticas.", "¡Sí! Si cae el servidor del menú de un restaurante, no pasa mucho. Si cae el radar de un aeropuerto (Alta Criticidad), es una catástrofe.", "El precio no define la criticidad.", "Es solo un parámetro más."]},
                    {enunciado: "¿Qué es un servidor tipo 'Blade'?", opciones: ["Un servidor con bordes muy afilados", "Servidores modulares súper compactos (como cuchillas) que se insertan en un chasis que comparte energía y red", "Un servidor que corta la conexión", "Un tipo de disco NVMe"], correcta: 1, feedback: ["Blade significa hoja/cuchilla, pero por su forma plana.", "¡Exacto! Ahorran muchísimo espacio y cables porque el chasis principal gestiona la energía de todos los 'Blades' insertados.", "Falso.", "Falso."]},
                    {enunciado: "¿Qué es un Clúster de servidores?", opciones: ["Un servidor que se ha roto en pedazos", "Un grupo de varios servidores físicos que trabajan juntos viéndose desde fuera como un solo súper-ordenador", "Un cable muy largo atado", "Una oficina de trabajo"], correcta: 1, feedback: ["No están rotos.", "¡Correcto! Si un servidor del clúster explota, los demás asumen su carga de trabajo y el servicio (ej. Google) no se cae.", "Falso.", "Falso."]},
                    {enunciado: "¿Qué es el PUE (Power Usage Effectiveness) en un CPD?", opciones: ["Un programa de limpieza", "Una métrica que indica la eficiencia energética (cuánta energía va a los equipos vs cuánta se gasta en enfriarlos)", "El peso total del rack", "Un virus de red"], correcta: 1, feedback: ["No es software.", "¡Sí! Lo ideal es acercarse a 1.0 (toda la electricidad se usa para calcular). Si es 2.0, por cada Vatio de cálculo, gastas otro Vatio en aire acondicionado.", "Mide electricidad.", "Falso."]},
                    {enunciado: "¿Qué es una red SAN (Storage Area Network)?", opciones: ["Una red wifi pública", "Una red separada y de altísima velocidad dedicada exclusivamente a conectar los servidores con las cabinas de almacenamiento", "Un tipo de router doméstico", "Un cable de audio"], correcta: 1, feedback: ["Es totalmente privada y cableada.", "¡Exacto! Usan fibra óptica para que el servidor crea que tiene el disco conectado localmente, aunque esté en otro armario.", "No sirve para casa.", "Falso."]},
                    {enunciado: "¿Por qué los CPDs Tier IV suelen tener doble acometida eléctrica?", opciones: ["Para gastar el doble de luz", "Para recibir electricidad de dos subestaciones eléctricas distintas de la ciudad; si una ciudad se apaga, la otra subestación sigue dando luz", "No la tienen", "Para cargar móviles rápido"], correcta: 1, feedback: ["Gastarías lo mismo repartido.", "¡Correcto! Se busca eliminar cualquier 'Punto Único de Fallo' (SPOF) en toda la infraestructura.", "Los de máxima categoría sí.", "No es para eso."]}
                    // 🔽 PEGA AQUÍ EL RESTO DE PREGUNTAS DEL TEMA 7 🔽
                ],
                "Tema 8: Mantenimiento, S.M.A.R.T. y Backups": [
                    {enunciado: "¿Qué diferencia fundamental hay entre una 'Imagen de respaldo' y una simple copia de archivos?", opciones: ["Es exactamente lo mismo", "La imagen es un clon exacto que incluye el Sistema Operativo, configuración y arranque; los archivos solo son datos", "La imagen sirve solo para guardar fotografías", "Copiar archivos es mucho más seguro"], correcta: 1, feedback: ["No lo es.", "¡Correcto! Si tu disco muere, metes la Imagen en un disco nuevo y el PC arranca idéntico a como estaba ayer. Con los archivos tendrías que instalar Windows desde cero.", "Su nombre engaña, no son 'fotos'.", "Al revés, tardas más en recuperarte."]},
                    {enunciado: "¿Qué significa el concepto P2V (Physical to Virtual)?", opciones: ["Pagar por ver contenidos", "El proceso de clonar un servidor físico de chapa para convertirlo en una máquina virtual que corra en un Hypervisor", "Poner dos ventiladores en la caja", "Un protocolo de transmisión de vídeo"], correcta: 1, feedback: ["Eso es Pay-Per-View.", "¡Sí! Es clave en la modernización de empresas: coger un PC viejo y pasarlo entero a una ventana virtual dentro de un servidor nuevo.", "Falso.", "Falso."]},
                    {enunciado: "¿En qué consiste el mantenimiento preventivo?", opciones: ["Arreglar el ordenador cuando ya no enciende", "Tareas rutinarias para evitar fallos antes de que ocurran (limpieza de polvo, actualizaciones, revisar cables)", "Comprar un equipo nuevo cada año", "Instalar juegos nuevos"], correcta: 1, feedback: ["Eso es correctivo.", "¡Exacto! Prevenir es mejor que curar. Un ventilador limpio evita que la CPU se sobrecaliente y se queme.", "Eso es derrochar.", "No es mantenimiento."]},
                    {enunciado: "¿En qué consiste el mantenimiento correctivo?", opciones: ["Limpiar el PC por dentro con aire", "Actuar para reparar o sustituir un componente que ya se ha roto o ha fallado", "Hacer copias de seguridad", "Mirar la temperatura del sistema"], correcta: 1, feedback: ["Eso es preventivo.", "¡Correcto! Si la fuente de alimentación echa humo, el mantenimiento correctivo es ir, quitarla y poner una nueva.", "Eso es prevención/respaldo.", "Eso es predictivo/monitorización."]},
                    {enunciado: "¿En qué consiste el mantenimiento predictivo?", opciones: ["Adivinar el futuro con una bola de cristal", "Usar datos y herramientas (como S.M.A.R.T) para anticipar matemáticamente cuándo va a fallar un componente", "Limpiar los filtros de polvo", "Actualizar la versión de la BIOS"], correcta: 1, feedback: ["No es magia, son datos.", "¡Sí! Si el disco duro te avisa de que tiene sectores defectuosos, 'predices' que morirá pronto y lo cambias antes de perder datos.", "Eso es preventivo.", "Preventivo."]},
                    {enunciado: "¿Qué herramienta básica de software libre permite ver la salud y temperatura de los discos (tecnología S.M.A.R.T.)?", opciones: ["Microsoft Word", "CrystalDiskInfo", "La calculadora de Windows", "Paint"], correcta: 1, feedback: ["Ofimática.", "¡Correcto! Te dirá si el disco está 'Bueno', 'En Riesgo' o 'Malo' leyendo los sensores internos del propio hardware.", "Operaciones matemáticas.", "Dibujo."]},
                    {enunciado: "¿Qué caracteriza a una copia de seguridad INCREMENTAL?", opciones: ["Copia absolutamente todos los archivos cada vez (tarda mucho)", "Solo copia los datos que han cambiado o se han creado desde la última copia de seguridad (es muy rápida y ocupa poco)", "Borra el disco y lo vuelve a grabar", "Solo hace copias de seguridad de imágenes y fotos"], correcta: 1, feedback: ["Esa sería una copia Completa (Full).", "¡Exacto! Si ayer hiciste backup total y hoy creaste un Word, el backup incremental de hoy solo guarda ese pequeño Word.", "Eso es formatear.", "Falso."]},
                    {enunciado: "¿Qué es una restauración 'Bare-Metal' (Bare-Metal Restore)?", opciones: ["Limpiar el metal de la caja del PC con alcohol", "Restaurar una imagen del sistema directamente en un ordenador 'pelado', vacío y sin sistema operativo previo", "Cambiar la chapa lateral", "Pintar el PC de colores metálicos"], correcta: 1, feedback: ["Es un término de software, no de limpieza.", "¡Sí! Pones un disco nuevo de fábrica (Bare Metal = Metal desnudo), metes el USB con el backup, y en 20 minutos tienes el PC funcionando como antes.", "Falso.", "Modding, no mantenimiento."]},
                    {enunciado: "¿Por qué el polvo acumulado es el mayor enemigo físico de un ordenador?", opciones: ["Principalmente porque hace que el PC sea muy feo", "Porque actúa como una 'manta' térmica aislante y atasca los ventiladores, provocando sobrecalentamiento", "No es malo, no pasa nada", "Porque borra los archivos del disco duro por estática"], correcta: 1, feedback: ["La estética no rompe el PC.", "¡Correcto! El calor no puede salir, los chips hacen 'Thermal Throttling' (bajan su velocidad para no fundirse) y el PC se vuelve lentísimo o se apaga.", "Es letal a la larga.", "El polvo no borra datos así."]},
                    {enunciado: "¿Qué programa es el estándar en ASIR para monitorizar voltajes y temperaturas de todos los sensores de la placa?", opciones: ["HWiNFO / HWMonitor", "Microsoft Excel", "Google Chrome", "Spotify"], correcta: 0, feedback: ["¡Sí! Te da lecturas en tiempo real de cuánto calor hace en cada rincón de tu placa, CPU y GPU.", "Hojas de cálculo.", "Navegador web.", "Música."]},
                    {enunciado: "¿Cuál es la regla de oro '3-2-1' fundamental de los Backups?", opciones: ["Tener 3 PCs, 2 discos externos y 1 copia en la nube", "Tener 3 copias de los datos, en 2 medios de almacenamiento distintos, con 1 de ellas fuera de la oficina física", "Hacer copia cada 3 días, a las 2 horas y 1 minuto", "No existe esa regla"], correcta: 1, feedback: ["Confuso y no estándar.", "¡Correcto! Ej: El original en tu PC, una copia en un NAS local, y otra copia en la nube por si se incendia tu casa.", "No tiene que ver con el tiempo.", "Es el estándar mundial de seguridad."]},
                    {enunciado: "¿Qué es el 'Ransomware' y por qué hace vitales las copias de seguridad?", opciones: ["Un driver para tarjetas gráficas", "Un virus que secuestra y cifra tus archivos pidiendo un rescate en criptomonedas para devolverlos", "Un juego de hackers", "Un tipo de memoria RAM"], correcta: 1, feedback: ["Falso.", "¡Exacto! Si tienes un backup offline que el virus no pudo alcanzar, simplemente formateas el PC, restauras la copia y no pagas a los criminales.", "Es real y muy peligroso.", "Falso."]},
                    {enunciado: "¿Qué es un 'Snapshot' (Instantánea) en virtualización?", opciones: ["Hacerle una foto al monitor con el móvil", "Congelar y guardar el estado exacto de una máquina virtual (RAM y disco) en ese preciso segundo para poder volver atrás si te equivocas", "Un cable de red muy rápido", "Un tipo de disco NVMe pequeño"], correcta: 1, feedback: ["Eso es una captura de pantalla externa.", "¡Sí! Antes de actualizar un servidor, haces un Snapshot. Si la actualización rompe todo, en 5 segundos reviertes al Snapshot y no ha pasado nada.", "No es hardware.", "No es hardware."]},
                    {enunciado: "¿Para qué sirve exactamente un bote de 'Aire comprimido' en informática?", opciones: ["Para que el técnico respire mejor", "Para expulsar a presión el polvo de los disipadores de aluminio y aspas de ventiladores sin tocarlos", "Para enfriar el café de la oficina", "Para pintar la caja metálica"], correcta: 1, feedback: ["No es oxígeno médico.", "¡Correcto! Al ser aire seco, no provoca cortos y limpia sin riesgo de soltar descargas estáticas por fricción (como haría un trapo).", "Saldría muy caro.", "Falso."]},
                    {enunciado: "¿Qué se debe hacer OBLIGATORIAMENTE antes de abrir un PC para hacer limpieza de componentes internos?", opciones: ["Encenderlo para ver dónde está el polvo", "Apagarlo desde el SO, apagar el interruptor de la fuente y desconectar el cable de la pared", "Poner música relajante", "Abrir el navegador web"], correcta: 1, feedback: ["Los ventiladores girando te golpearían y habría riesgo eléctrico.", "¡Exacto! Y pulsar el botón de encendido sin el cable para drenar la energía residual de los condensadores.", "Opcional.", "Imposible sin pantalla."]},
                    {enunciado: "¿Qué es la clonación directa de discos?", opciones: ["Tener dos discos de la misma marca", "Crear una copia idéntica bit a bit y sector a sector de un disco origen hacia un disco destino", "Un virus que duplica archivos basura", "Una técnica ilegal"], correcta: 1, feedback: ["No implica clonación de datos.", "¡Sí! Si cambias tu disco duro viejo por un SSD, lo clonas y al encender el SSD tendrás tu mismo Windows, fondos de pantalla y programas.", "Falso.", "Es totalmente legal."]},
                    {enunciado: "¿Qué componente hardware suele ser siempre el primero en fallar con los años debido a su naturaleza mecánica?", opciones: ["La CPU (Procesador)", "El Disco Duro Mecánico (HDD) o los ventiladores", "La memoria RAM", "La Placa Base"], correcta: 1, feedback: ["La CPU puede durar décadas si se refrigera bien.", "¡Correcto! Todo lo que tenga motores y piezas giratorias sufre desgaste físico por fricción.", "No tiene partes móviles.", "No tiene partes móviles."]},
                    {enunciado: "¿Qué es un Plan de Recuperación ante Desastres (DRP - Disaster Recovery Plan)?", opciones: ["Un juego de mesa corporativo", "Un documento maestro con los pasos estrictos a seguir para restaurar los servidores tras un incendio o ciberataque", "Un cable para enchufar discos externos", "Una versión de la BIOS"], correcta: 1, feedback: ["La caída de la empresa no es un juego.", "¡Sí! En medio del pánico de un hackeo, los técnicos solo tienen que leer el manual DRP para saber qué encender primero y cómo restaurar los backups.", "Falso.", "Falso."]},
                    {enunciado: "¿Cada cuánto tiempo recomienda la industria una limpieza física interna básica de un PC?", opciones: ["Cada día al levantarse", "Aproximadamente una vez al año (dependiendo de si hay mascotas, fumas o el polvo del entorno)", "Nunca en la vida útil", "Cada 10 años"], correcta: 1, feedback: ["Sería obsesivo y contraproducente abrirlo tanto.", "¡Correcto! Si está en el suelo o hay gatos en casa, mejor revisarlo cada 6 meses.", "Se quemará antes de tiempo.", "No llegaría a encender."]},
                    {enunciado: "¿Por qué se dice que 'un backup no es backup hasta que se verifica'?", opciones: ["Porque suena filosófico", "Porque necesitas comprobar periódicamente que el archivo de copia no está corrupto y que realmente sabes restaurarlo", "Porque hay que borrarlo", "Porque tienes que ponerle nombre y contraseña"], correcta: 1, feedback: ["Es una realidad operativa.", "¡Exacto! Muchas empresas descubren que su backup lleva meses fallando justo el día que lo necesitan para salvar la compañía. Hay que hacer simulacros de restauración.", "Nunca se borra sin tener otro.", "Poner nombre no garantiza que funcione."]}
                    // 🔽 PEGA AQUÍ EL RESTO DE PREGUNTAS DEL TEMA 8 🔽
                ],
                "Tema 9: Cloud Computing (La Nube)": [
                    {enunciado: "¿Qué es el Cloud Computing en términos sencillos?", opciones: ["Poner antenas wifi mirando al cielo", "Alquilar recursos informáticos (servidores, discos, bases de datos) a través de Internet pagando solo lo que usas", "Un sistema operativo local muy moderno", "Un tipo de cable de fibra óptica"], correcta: 1, feedback: ["La nube no está en el cielo, está en los CPDs físicos.", "¡Correcto! En vez de comprar un servidor caro de 5000€, le alquilas a Amazon (AWS) un servidor por horas mientras lo necesites.", "No es local, está en internet.", "Usa cables, pero es un modelo de negocio/tecnología."]},
                    {enunciado: "¿Qué es el Cloud Computing en términos sencillos?", opciones: ["Poner antenas wifi mirando al cielo", "Alquilar recursos informáticos (servidores, discos, bases de datos) a través de Internet pagando solo lo que usas", "Un sistema operativo local muy moderno", "Un tipo de cable de fibra óptica"], correcta: 1, feedback: ["La nube no está en el cielo, está en los CPDs físicos.", "¡Correcto! En vez de comprar un servidor caro de 5000€, le alquilas a Amazon (AWS) un servidor por horas mientras lo necesites.", "No es local, está en internet.", "Usa cables, pero es un modelo de negocio/tecnología."]},
                    {enunciado: "¿Qué modelo de servicio cloud es IaaS (Infraestructura como Servicio)?", opciones: ["Software final para usuarios normales", "Te alquilan la máquina virtual 'pelada', la red y el almacenamiento; tú instalas el SO y lo gestionas todo", "Una plataforma para que los programadores hagan apps", "Internet para casas"], correcta: 1, feedback: ["Eso es SaaS.", "¡Sí! Como montar tu PC pieza a pieza virtualmente (ej. Amazon EC2). Tú eres el responsable del Windows o Linux.", "Eso es PaaS.", "Es conectividad, no IaaS."]},
                    {enunciado: "¿Qué modelo de servicio cloud es SaaS (Software como Servicio)?", opciones: ["Alquilar servidores Linux vacíos", "Usar una aplicación final por internet sin instalar nada y gestionada al 100% por el proveedor (ej. Gmail, Microsoft 365)", "Hacer copias de seguridad de pendrives", "Un tipo de disco duro virtual"], correcta: 1, feedback: ["Eso es IaaS.", "¡Exacto! Tú solo te logueas y lo usas. No te importa en qué servidor esté ni cómo se actualice.", "Eso es un servicio de Backup.", "Es software, no solo almacenamiento."]},
                    {enunciado: "¿Qué es PaaS (Plataforma como Servicio)?", opciones: ["Un país de Europa", "Te dan el entorno listo (con base de datos, servidor web, etc.) para que tú solo subas tu código y programes (ej. Heroku)", "Un tipo de RAM para servidores", "Un router de la nube"], correcta: 1, feedback: ["Es un acrónimo tecnológico.", "¡Correcto! Ideal para desarrolladores. No tienen que instalar Apache ni configurar Linux, solo subir su web y funciona.", "Falso.", "Falso."]},
                    {enunciado: "¿Qué significa el concepto moderno 'Serverless' (Sin Servidor)?", opciones: ["Que la empresa ha vendido todos los ordenadores físicos", "Tú escribes un código, lo subes, y la Nube lo ejecuta mágicamente cuando alguien entra a tu web, cobrándote por milisegundo de uso. Cero gestión.", "Un servidor que está roto y no funciona", "Usar solo software libre sin internet"], correcta: 1, feedback: ["Los servidores físicos siguen existiendo en el CPD de Google/Amazon.", "¡Sí! El nivel máximo de abstracción (ej. AWS Lambda). El proveedor gestiona absolutamente toda la infraestructura por detrás.", "No.", "Falso."]},
                    {enunciado: "¿Qué problema resuelve el 'Edge Computing' (Computación en el borde)?", opciones: ["Procesar los datos muy cerca de donde se generan (antenas, sensores) en vez de mandarlos a la nube lejana, reduciendo la latencia a casi cero", "Hace que el internet doméstico sea más lento para ahorrar", "Un tipo de monitor de pantalla curva", "Tirar un cable muy largo por el borde del suelo"], correcta: 0, feedback: ["¡Exacto! Vital para coches autónomos: si el coche tiene que frenar, no puede esperar a que el servidor de Irlanda responda.", "No, acelera los tiempos de respuesta.", "Borde físico de la pantalla, no de red.", "Literal, pero falso."]},
                    {enunciado: "¿Qué dicta el vital 'Modelo de Responsabilidad Compartida' en la Nube?", opciones: ["Que si hay un hackeo, nadie es el responsable", "Amazon/Microsoft protegen la sala de servidores (CPD y hardware); el cliente es el responsable de no poner '1234' como contraseña de su servidor virtual", "Toda la culpa si te roban datos es siempre del proveedor", "El usuario debe pagar la seguridad de la puerta física"], correcta: 1, feedback: ["Siempre hay un responsable.", "¡Correcto! La seguridad 'DE' la nube es suya. La seguridad 'EN' la nube es tuya.", "Falso, si dejas tu base de datos pública, es culpa tuya.", "Tú no tienes llave del edificio."]},
                    {enunciado: "¿Qué gran ventaja económica tiene la nube frente al modelo tradicional On-premise (servidores en tu propia oficina)?", opciones: ["Los servidores en la nube son más bonitos", "Gastos operativos (OPEX): Escalabilidad rápida y pagas solo por los recursos exactos que consumes", "No necesitas conexión a internet para usarla", "Siempre es totalmente gratis ilimitado"], correcta: 1, feedback: ["Nunca los vas a ver físicamente.", "¡Sí! Si en el Black Friday necesitas 10 servidores, los creas en 1 minuto. El lunes los borras y dejas de pagar.", "Obligatorio tener red.", "Cuesta dinero, a veces mucho si no lo vigilas."]},
                    {enunciado: "¿Qué es una Nube Híbrida?", opciones: ["Una nube meteorológica que trae lluvia y nieve", "La combinación de mantener servidores físicos privados críticos en tu oficina y conectarlos con la nube pública (AWS/Azure)", "Un tipo de disco SSD híbrido", "No existe ese término"], correcta: 1, feedback: ["Cuidado con el paraguas.", "¡Exacto! Los bancos la usan mucho: guardan los datos súper secretos en su edificio, y usan la nube pública para la web y los usuarios.", "Es un modelo de red.", "Es la arquitectura más demandada en empresas grandes."]},
                    {enunciado: "¿En qué consiste la Escalabilidad Horizontal (Scale Out)?", opciones: ["Poner un servidor más potente cambiando sus piezas", "Si tienes muchas visitas, clonas tu servidor y pones 2, 3 o 10 servidores paralelos a repartirse el trabajo", "Tumbar el servidor en la mesa", "Cambiar los cables de red"], correcta: 1, feedback: ["Eso es Vertical.", "¡Correcto! Es la magia de Netflix o Spotify: según la hora del día, encienden y apagan cientos de servidores clones para aguantar a los usuarios.", "Físicamente irrelevante.", "No influye."]},
                    {enunciado: "¿Qué es el Escalado Vertical (Scale Up)?", opciones: ["Añadir más máquinas iguales a la red", "Mejorar los componentes de la misma máquina (apagar, añadirle más RAM, más CPU y volver a encender)", "Poner la torre del PC de pie", "No existe"], correcta: 1, feedback: ["Eso es Horizontal.", "¡Sí! Como cuando le pones más memoria a tu PC. El problema es que tiene un límite máximo físico de ampliación.", "Físico irrelevante.", "Existe y es común en bases de datos pequeñas."]},
                    {enunciado: "¿Qué es la 'Latencia' en la nube?", opciones: ["El precio que pagas al mes", "El retraso en milisegundos que tarda la información en viajar por la red desde ti hasta el servidor y volver", "El tamaño máximo de los archivos subidos", "La marca del procesador del servidor"], correcta: 1, feedback: ["Esa es la factura.", "¡Correcto! Por eso Netflix pone servidores en Madrid, para que la película empiece antes que si la trajeran desde Nueva York.", "Ancho de banda / Cuota.", "Falso."]},
                    {enunciado: "¿Qué gigante tecnológico está detrás de AWS?", opciones: ["Un tipo de cable submarino", "Amazon Web Services (el proveedor de nube pública más grande del mundo)", "Un sistema operativo ruso", "Un antivirus gratuito"], correcta: 1, feedback: ["Es proveedor.", "¡Exacto! Amazon gana más dinero alquilando servidores que vendiendo paquetes por internet.", "No es un SO.", "No."]},
                    {enunciado: "¿A qué empresa pertenece la nube 'Azure'?", opciones: ["Es una empresa independiente", "Es la plataforma de Cloud Computing de Microsoft", "Es un disco duro de Apple", "Es un lenguaje de programación web"], correcta: 1, feedback: ["Pertenece a la empresa de Redmond.", "¡Sí! Es el segundo proveedor mundial y el estándar en la mayoría de grandes corporaciones.", "Falso.", "Falso."]},
                    {enunciado: "¿Qué significan las siglas GCP en el entorno cloud?", opciones: ["Un protocolo de enrutamiento web", "Google Cloud Platform", "Un tipo de memoria RAM para gaming", "Una tarjeta gráfica profesional"], correcta: 1, feedback: ["Falso.", "¡Correcto! Es la oferta de nube pública de Google, muy potente en temas de Inteligencia Artificial y bases de datos.", "Falso.", "Falso."]},
                    {enunciado: "¿A qué hace referencia el peligro del 'Vendor Lock-in' (Cautividad tecnológica)?", opciones: ["A que el servidor cierre por vacaciones", "Construir tu app de forma tan acoplada a las herramientas exclusivas de Amazon que luego te es imposible mudarte a Microsoft si suben los precios", "Un tipo de seguridad mediante llaves físicas USB", "Pagar con tarjeta de crédito encriptada"], correcta: 1, feedback: ["Los CPDs no cierran.", "¡Exacto! Quedas atrapado como rehén con tu proveedor porque salirte te costaría años de reprogramación.", "Seguridad física.", "Falso."]},
                    {enunciado: "¿Qué es un 'Bucket' en almacenamiento cloud (ej. Amazon S3)?", opciones: ["Un cubo para fregar el CPD", "Un contenedor plano para guardar infinidad de objetos/archivos estáticos (imágenes, vídeos, backups) mediante URLs", "Un tipo de cable gordo", "Un virus en forma de troyano"], correcta: 1, feedback: ["Significa cubo en inglés, pero su uso es virtual.", "¡Sí! No tiene carpetas físicas como C:, metes ahí tus fotos y la web las carga a millones de personas a la vez (Object Storage).", "No.", "No."]},
                    {enunciado: "¿Qué permite la técnica 'Infraestructura como Código' (IaC)?", opciones: ["Escribir manuales en Word para tus compañeros", "Gestionar y levantar cientos de servidores en la nube escribiendo un simple archivo de configuración de texto (ej. Terraform o Ansible)", "Programar placas base soldando", "No existe"], correcta: 1, feedback: ["La documentación importa, pero esto es operativo.", "¡Correcto! En vez de estar haciendo clic en menús durante horas, corres un script y toda tu red de empresa se despliega automáticamente en 3 minutos.", "Hardware puro.", "Es el estándar DevOps actual."]},
                    {enunciado: "¿Qué medida de seguridad básica debes exigir siempre (MFA/2FA)?", opciones: ["Hacer muchas fotos de pantalla", "Doble capa de seguridad para loguearte: contraseña y un código temporal en tu móvil para evitar robos de cuenta", "Un tipo de procesador que cifra la RAM", "Una red social corporativa"], correcta: 1, feedback: ["MFA = Multi-Factor Authentication.", "¡Exacto! Si un hacker consigue tu contraseña de la nube, sin tu teléfono móvil físico no podrá entrar a borrar tus servidores.", "Falso.", "Falso."]},
                    {enunciado: "¿Qué representa una 'Región' en la arquitectura de la Nube pública?", opciones: ["Un país políticamente", "Una ubicación geográfica enorme (ej. 'Europa-Sur') que contiene varios Centros de Datos separados físicamente por seguridad", "Un tipo de software de bases de datos", "Un cable que une continentes"], correcta: 1, feedback: ["No siempre coinciden con fronteras políticas.", "¡Sí! Si alojas tus datos en la Región de Madrid y un terremoto destruye un CPD, los otros CPDs de la misma región asumen la carga y tu web no se cae.", "Falso.", "Los usan, pero no lo son."]
                }
                    // 🔽 MANTÉN AQUÍ TUS PREGUNTAS DE HARDWARE 🔽
                ]
            },

            "MPO - Nube": {
                "Preguntas diapositivas Ignacio": [
                    {enunciado:"¿Qué es una región en AWS y cuál es la diferencia entre una región y una Availability Zone?", opciones:["Una región es un centro de datos y una AZ es un país entero.","Una región es un área geográfica, y una AZ es uno o varios centros de datos aislados dentro de esa región.","Son lo mismo, solo cambia el nombre según el continente en el que se encuentre.","Una región es exclusivamente para instancias EC2 y una AZ es para bases de datos RDS."], correcta:1, feedback:["Incorrecto. Al revés: la región es enorme y el centro de datos es más pequeño.","¡Correcto! Las regiones contienen varias AZs, y cada AZ (Zona de Disponibilidad) tiene su propia energía, red y refrigeración.","Incorrecto. Son conceptos completamente distintos jerárquicamente.","Incorrecto. Todos los servicios principales pueden residir tanto en regiones como en sus AZs."]},
                    {enunciado:"¿Qué criterios me van a llevar a decidir elegir una región u otra?", opciones:["El tipo de sistema operativo que vaya a instalar en las instancias.","Solo el precio, ya que la latencia siempre es de 0 ms en todo el mundo.","Latencia hacia los usuarios, coste de los servicios, servicios disponibles y cumplimiento legal/normativo.","El número de usuarios de IAM que necesite crear para mi empresa."], correcta:2, feedback:["Incorrecto. Windows y Linux están disponibles en todas las regiones globales.","Incorrecto. La latencia depende de la física; si tu cliente está en España y el servidor en Japón, habrá latencia.","¡Correcto! Esos son los cuatro pilares fundamentales para arquitectar en AWS.","Incorrecto. El servicio IAM (Identidades) es global y no reside en una región específica."]},
                    {enunciado:"¿Qué tres factores son los fundamentales para determinar el coste de AWS?", opciones:["Cómputo, almacenamiento y transferencia de datos de salida (Outbound).","Cómputo, direcciones MAC y transferencia de datos de entrada (Inbound).","Almacenamiento, usuarios IAM y creación de subredes VPC.","Tiempo de conexión por SSH, cantidad de AZs y peticiones HTTP."], correcta:0, feedback:["¡Correcto! El tiempo de proceso, los gigas de disco y el ancho de banda de salida son el grueso de tu factura.","Incorrecto. Por norma general, meter datos en AWS (Inbound) es totalmente gratuito.","Incorrecto. Crear usuarios IAM o redes VPC es un servicio sin coste por defecto.","Incorrecto. Eso no determina directamente los costes troncales del servicio."]},
                    {enunciado:"¿Qué es EC2, qué es S3?", opciones:["EC2 es almacenamiento en bloque y S3 es para bases de datos relacionales.","EC2 es una red virtual privada y S3 es un cortafuegos en la nube.","Ambos son servicios de almacenamiento, pero EC2 es para sistemas Linux y S3 para Windows.","EC2 proporciona servidores virtuales de cómputo y S3 es un servicio de almacenamiento de objetos."], correcta:3, feedback:["Incorrecto. El almacenamiento en bloque es EBS y bases relacionales es RDS.","Incorrecto. La red es VPC y el cortafuegos son los Security Groups / WAF.","Incorrecto. EC2 no es puramente almacenamiento, es poder de procesamiento (CPU/RAM).","¡Correcto! EC2 (Elastic Compute Cloud) es tu servidor, S3 (Simple Storage Service) es tu cajón inmenso para guardar ficheros, fotos, backups..."]},
                    {enunciado:"¿Qué es una política de IAM y en qué formato están escritas?", opciones:["Es un usuario administrador de sistemas, escrito en formato XML.","Es un documento que define permisos explícitos de permitir/denegar, escrito en formato JSON.","Es un script de arranque para configurar instancias EC2, escrito en YAML.","Es una regla de firewall para proteger la VPC, escrita en formato de tabla binaria."], correcta:1, feedback:["Incorrecto. No es un usuario, son las reglas que se le aplican al usuario. Tampoco usa XML.","¡Correcto! Las IAM Policies son documentos JSON puros que rigen exactamente a qué recursos puedes acceder.","Incorrecto. Ese concepto corresponde al 'User Data' de EC2.","Incorrecto. Mezclas seguridad de identidad (IAM) con seguridad de red (VPC)."]},
                    {enunciado:"¿Quién es el responsable de gestionar la seguridad de mi aplicación y de los datos que utiliza?", opciones:["AWS gestiona absolutamente todo automáticamente, el cliente solo sube el código.","El cliente (tú), según el Modelo de Responsabilidad Compartida de AWS.","Depende de la región; en Europa es responsabilidad total de AWS por la GDPR.","La empresa proveedora de Internet (ISP) del usuario final."], correcta:1, feedback:["Incorrecto. AWS se encarga de la 'seguridad de la nube' (hardware, edificios), pero no de lo que hay 'en la nube'.","¡Correcto! Tú eres responsable de parchear tu sistema operativo, cifrar tus datos y configurar bien los firewalls.","Incorrecto. El modelo es mundial, el cumplimiento de tus leyes es responsabilidad tuya.","Incorrecto. Falso."]},
                    {enunciado:"¿Cuántas ips hay disponibles para la red 192.168.1.0 / 24 ?", opciones:["256 IPs disponibles en total.","254 IPs disponibles (restando dirección de red y broadcast).","255 IPs disponibles.","251 IPs disponibles."], correcta:3, feedback:["Incorrecto. Ese es el total matemático de un /24, pero AWS reserva varias para su propio uso interno.","Incorrecto. Eso sería en una red local física tradicional (switch casero), en la nube cambian las reglas.","Incorrecto. Nunca es impar.","¡Correcto! AWS siempre te 'roba' 5 IPs por cada subred para router, DNS, red, broadcast y una reserva futura. (256 - 5 = 251)."]},
                    {enunciado:"¿Para qué sirve la tabla de enrutamiento en la red?", opciones:["Contiene reglas (rutas) que determinan hacia dónde se dirige el tráfico de red de una subred o gateway.","Asigna de forma automática nombres de dominio (.com) a direcciones IP públicas.","Bloquea ataques de denegación de servicio (DDoS) automáticamente.","Balancea la carga de tráfico web entre múltiples instancias EC2."], correcta:0, feedback:["¡Correcto! Es el 'mapa' que le dice a la subred, por ejemplo, cómo salir a Internet (apuntando al Internet Gateway).","Incorrecto. Eso es trabajo de Amazon Route 53 (DNS).","Incorrecto. Eso es trabajo de AWS Shield.","Incorrecto. Eso es trabajo del Elastic Load Balancer (ELB)."]},
                    {enunciado:"¿Cuál es la diferencia entre un grupo de seguridad y un ACL en relación a la seguridad de la VPC?", opciones:["Los grupos de seguridad son para proteger S3 y las ACL son para proteger EC2.","Los grupos de seguridad deniegan tráfico por defecto explícitamente, las ACL solo permiten.","Los SG actúan a nivel de instancia y tienen estado (stateful), las ACL actúan a nivel de subred y no tienen estado (stateless).","Son exactamente lo mismo, pero el ACL es la versión de pago premium para empresas."], correcta:2, feedback:["Incorrecto. Ambos son componentes de red y protegen recursos dentro de la VPC (como EC2).","Incorrecto. Es al revés, en un SG todas las reglas son de PERMITIR (allow), no puedes crear reglas 'deny'. En ACL sí.","¡Correcto! Al ser 'stateful', si un SG permite entrar a una petición, la deja salir automáticamente. En ACL tienes que abrir ida y vuelta.","Incorrecto. Ambos son gratuitos y sus mecánicas de funcionamiento son distintas."]},
                    {enunciado:"¿Qué significa que en mi grupo de seguridad permita la entrada al puerto 80 a 0.0.0.0/0?", opciones:["Permite tráfico HTTPS (seguro) solo desde la red local de la empresa.","Permite tráfico HTTP entrante desde cualquier dirección IP de Internet.","Bloquea todo el tráfico que intente entrar por el puerto 80.","Permite salida a Internet al servidor EC2 para buscar actualizaciones."], correcta:1, feedback:["Incorrecto. El 80 es HTTP (inseguro). HTTPS es el 443.","¡Correcto! El CIDR 0.0.0.0/0 significa 'absolutamente todas las IPs posibles'. Tu servidor web es público.","Incorrecto. Las reglas en los Grupos de Seguridad solo permiten, nunca bloquean explícitamente.","Incorrecto. Es una regla de entrada (Inbound), no de salida (Outbound)."]},
                    {enunciado:"¿Qué es AWS Cloud Front? ¿qué ventajas nos ofrece?", opciones:["Es un cortafuegos web que nos protege de inyecciones de código SQL.","Es el servicio especializado de AWS para desplegar contenedores de Docker.","Es el panel centralizado de facturación donde se ven los costes previstos del mes.","Es un servicio de CDN global que acelera la entrega de contenido caché a los usuarios, reduciendo drásticamente la latencia."], correcta:3, feedback:["Incorrecto. Ese servicio de protección perimetral se llama AWS WAF.","Incorrecto. Eso sería ECS (Elastic Container Service) o EKS (Kubernetes).","Incorrecto. Eso es AWS Cost Explorer / Billing.","¡Correcto! Guarda copias de tus imágenes/web en cientos de 'Edge Locations' por todo el mundo para entregarlas rapidísimo."]},
                    {enunciado:"¿Qué es una AMI? ¿Para que se utiliza en la creación de instancias EC2?", opciones:["Amazon Machine Image. Proporciona la información (SO, programas preinstalados) requerida para lanzar una instancia EC2.","Amazon Metadata Interface. Se usa mediante curl a la IP 169.254.169.254 para ver los datos del servidor.","Amazon Memory Instance. Sirve para desplegar bases de datos en memoria caché de altísima velocidad.","Es un tipo de disco duro físico de altísimo rendimiento exclusivo para servidores EC2."], correcta:0, feedback:["¡Correcto! Es tu 'plantilla'. Contiene Linux o Windows y todo lo que necesites pre-cocinado para arrancar clones.","Incorrecto. La metadata de la instancia existe (y usa esa IP), pero no se llama AMI.","Incorrecto. Bases en memoria caché en AWS se usan con el servicio ElastiCache.","Incorrecto. Los discos duros de bloque son volúmenes EBS."]},
                    {enunciado:"¿Qué ocurre si la instancia se detiene y se vuelve a iniciar?", opciones:["Se borran todos los datos de los discos duros EBS secundarios adjuntos para liberar espacio.","La instancia podría cambiar de hardware subyacente y, si no tiene IP Elástica, su IP pública cambiará.","La instancia migra a otra Región geográfica automáticamente para equilibrar la carga global.","El sistema operativo se formatea volviendo a los valores de fábrica de la AMI."], correcta:1, feedback:["Incorrecto. El almacenamiento EBS persiste al apagar la instancia, no pierdes tus ficheros.","¡Correcto! AWS la mueve a un nuevo host físico sano. Al hacerlo, libera la IP pública anterior y te da una nueva al arrancar.","Incorrecto. Una vez creas algo en una región de AWS, jamás sale de ella sin tu permiso.","Incorrecto. Todo lo que hayas configurado y guardado en disco se queda exactamente igual."]},
                    {enunciado:"EC2: ¿se puede cambiar el tipo de una instancia que está arrancada?", opciones:["Sí, se puede cambiar en caliente (hot-swap) sin pérdida de conexión.","Solo se puede hacer en caliente si estás pasando de una AMI de Linux a otra de Windows.","Sí, pero solo puedes aumentar la RAM, si quieres subir CPU hay que reiniciarla.","No. Debes detener la instancia primero (Stop), cambiar el tipo y luego volver a arrancarla."], correcta:3, feedback:["Incorrecto. No se puede en caliente.","Incorrecto. Las AMI y los sistemas operativos no se pueden mutar una vez arrancados.","Incorrecto. Las instancias de EC2 no permiten escalado vertical parcial en caliente.","¡Correcto! Hay que apagarla porque AWS literalmente desenchufa tu disco y lo engancha en un host físico nuevo más potente."]},
                    {enunciado:"EC2, ¿qué ocurre con los discos que están asociados a una instancia (EBS Elastic Block Storage) cuando se para el servidor?", opciones:["Se borran automáticamente para no cobrarte almacenamiento por un servidor apagado.","Se mueven en segundo plano a un bucket de S3 para ahorrar dinero.","Los datos persisten intactos y puedes arrancar la instancia sin perder información.","El disco principal del SO se borra, pero los discos secundarios (D:) persisten."], correcta:2, feedback:["Incorrecto. ¡Ojo! AWS SÍ te cobra los gigas del disco EBS aunque tu máquina esté parada.","Incorrecto. EBS y S3 son servicios separados, no se mezclan mágicamente.","¡Correcto! El disco es independiente del estado de energía de la placa base virtual. Tu información está a salvo.","Incorrecto. Persisten absolutamente todos los volúmenes configurados."]},
                    {enunciado:"¿Para qué sirve una ip elástica?", opciones:["Es una IP pública estática que no cambia, ideal para asociarla a un dominio y que la web no se caiga al reiniciar el servidor.","Es una IP de red local (10.0.0.X) que cambia dinámicamente si el servidor tiene picos de tráfico altos.","Es una IP mágica que te permite balancear la carga entre servidores que están en distintos continentes.","Es el nombre técnico que le da AWS a la dirección IP del router de tu casa conectándose al panel."], correcta:0, feedback:["¡Correcto! Soluciona el problema de que AWS cambie tu IP pública cada vez que haces un 'Stop/Start' a tu instancia.","Incorrecto. Las IPs elásticas siempre son públicas, no privadas.","Incorrecto. Para balancear carga mundial se usa Route 53 o AWS Global Accelerator.","Incorrecto. Falso."]},
                    {enunciado:"¿A través de qué protocolo nos conectamos a servidores Windows?", opciones:["SSH (Secure Shell) a través del puerto 22.","RDP (Remote Desktop Protocol) a través del puerto 3389.","FTP (File Transfer Protocol) a través del puerto 21.","HTTP/HTTPS a través de un panel de navegador web embebido."], correcta:1, feedback:["Incorrecto. SSH es el rey absoluto en entornos Linux, no en Windows.","¡Correcto! Necesitarás descifrar la contraseña del Administrador con tu par de claves (.pem) y usar tu cliente de Escritorio Remoto.","Incorrecto. Eso solo transfiere archivos, no permite manejar el sistema gráfico.","Incorrecto. Aunque AWS ofrece Systems Manager (para consola web), el estándar directo de Windows es RDP."]},
                    {enunciado:"¿Cómo hago para añadir un nuevo disco duro a un servidor Windows?", opciones:["Simplemente crear un bucket en S3 y aparecerá en Mi PC automáticamente como unidad D:.","Reiniciar el servidor y pulsar F8 para entrar a la BIOS virtual de AWS para detectar hardware.","Crear un volumen EBS, adjuntarlo a la EC2 en AWS, y entrar al Administrador de Discos de Windows para inicializarlo y darle formato (letra).","Cambiar el tipo de instancia a una 'Large' y el disco extra crecerá de tamaño él solo."], correcta:2, feedback:["Incorrecto. S3 almacena objetos por red, no se comporta como un disco físico insertado en placa base.","Incorrecto. No tienes acceso de tan bajo nivel (BIOS/UEFI visual) en AWS.","¡Correcto! Creas el hardware en AWS, lo enchufas, pero el SO operativo Windows no lo leerá hasta que lo particiones por software interno.","Incorrecto. Cambiar el tipo afecta CPU y RAM, pero los discos gestionados por EBS van por separado."]},
                    {enunciado:"¿Cuando tiene sentido utilizar S3 y cuando EBS para el almacenamiento?", opciones:["EBS para discos duros de sistemas operativos o BBDD (alto rendimiento); S3 para copias de seguridad, imágenes, vídeos o documentos estáticos.","S3 para instalar el sistema operativo Linux y EBS para guardar las fotos de los usuarios de una web.","Ambos son idénticos tecnológicamente, la diferencia es que S3 se usa en Europa y EBS en América.","S3 es hiper-rápido para correr bases de datos relacionales intensivas; EBS es lento y se usa para archivo en frío."], correcta:0, feedback:["¡Correcto! EBS (almacenamiento en bloque) requiere estar atado a una EC2. S3 (almacenamiento de objetos) se accede por internet vía API.","Incorrecto. No puedes instalar un SO operativo en un bucket S3.","Incorrecto. Ambos servicios están en todo el mundo.","Incorrecto. S3 tiene una latencia mucho mayor que EBS y no soporta operaciones atómicas de bases de datos."]},
                    {enunciado:"¿S3 es un servicio global o está en una zona de disponibilidad?", opciones:["Está limitado y encerrado en una única Availability Zone. Si esa AZ se quema, pierdes los datos.","S3 reside físicamente en satélites geoestacionarios fuera de la red de la región terrestre.","Se asocia internamente a una subred de una VPC concreta, como si fuera una base de datos local.","Los datos se guardan a nivel de Región (mínimo 3 AZs de redundancia), pero el servicio y el nombre de los buckets son únicos a nivel Global."], correcta:3, feedback:["Incorrecto. S3 diseña sus arquitecturas con '11 nueves' de durabilidad, replicando tus fotos en varios edificios a la vez.","Incorrecto. Obviamente es falso, están en centros de datos terrestres de la región que elijas.","Incorrecto. Es un servicio externo gestionado, no vive dentro de tu red privada VPC.","¡Correcto! Por eso no puede haber dos buckets con el mismo nombre en todo el mundo de AWS, y debes elegir la región donde guardar los ficheros."]},
                    {enunciado:"¿Qué diferencias hay entre utilizar Amazon RDS y utilizar EC2 con una base de datos?", opciones:["En RDS solo puedes usar motores SQL Server, y en EC2 solo MySQL o Linux.","RDS es un servicio administrado (AWS hace backups, parches y failovers por ti). En EC2 tú gestionas el motor de BBDD desde cero.","RDS es un servidor físico de hierro dedicado para ti solo; EC2 es una partición virtual compartida.","No hay ninguna diferencia tecnológica, solo es una cuestión de métodos de pago en la factura."], correcta:1, feedback:["Incorrecto. RDS soporta muchísimos motores (Aurora, Postgres, MySQL, MariaDB, Oracle, SQLServer).","¡Correcto! RDS te quita el trabajo 'aburrido' y repetitivo de DBA para que tú solo te centres en optimizar consultas.","Incorrecto. Ambos utilizan máquinas virtuales por debajo.","Incorrecto. En EC2 tendrías que levantar el servidor a las 3 AM si se cae el proceso de MySQL; en RDS, AWS lo levanta por ti."]},
                    {enunciado:"¿Qué ventajas tiene la configuración de Amazon RDS MultiAZ?", opciones:["Duplica el rendimiento de lectura de tu base de datos, permitiendo muchísimos SELECTs simultáneos.","Hace que la base de datos sea accesible desde América y Europa simultáneamente con 0 milisegundos de latencia.","Proporciona Alta Disponibilidad y Failover automático. Crea una réplica oculta sincrónica en otra AZ y salta a ella si la principal muere.","Reduce tu factura de AWS a la mitad al aprovechar discos magnéticos más baratos en zonas sin uso."], correcta:2, feedback:["Incorrecto. Para escalar la lectura se usan las 'Read Replicas'. El standby de Multi-AZ no se puede leer, está oculto.","Incorrecto. Multi-AZ funciona dentro de la MISMA región, cruzando edificios (AZs), no continentes.","¡Correcto! Si hay un desastre de hardware, AWS cambia la ruta DNS a la base secundaria en menos de 60 segundos y tu app ni se entera.","Incorrecto. ¡Al contrario! Te cuesta el doble, porque tienes dos máquinas físicas encendidas 24/7 (una principal y un clon)."]}
                ],

           /*  "Redes": {
                // Usamos la función adaptadora y cogemos desde la pregunta 0 hasta la 27
                "Bloque 1: Fundamentos, Física y Ethernet": adaptarPreguntas(preguntasRedesBruto.slice(0, 27)),

        // ==============================================================
        // LÓGICA DE LA APLICACIÓN (Mantenemos tu lógica intacta)
        // ==============================================================
        
        let currentSubject = "";
        let currentBlock = "";
        let currentQuestionList = [];
        let currentIndex = 0;
        let userAnswers = []; 
        let answered = false;

        function init() {
            const subjectContainer = document.getElementById("subjects-container");
            subjectContainer.innerHTML = "";
            for (const subject in db) {
                const btn = document.createElement("button");
                btn.className = "btn";
                let totalQs = 0;
                for (let block in db[subject]) { totalQs += db[subject][block].length; }
                btn.textContent = `${subject} (${totalQs} pregs.)`;
                btn.onclick = () => showBlocks(subject);
                subjectContainer.appendChild(btn);
            }
        }

        function showBlocks(subject) {
            currentSubject = subject;
            document.getElementById("subject-area").style.display = "none";
            document.getElementById("quiz-area").style.display = "none";
            document.getElementById("result-area").style.display = "none";
            
            const blocksArea = document.getElementById("blocks-area");
            blocksArea.style.display = "block";
            document.getElementById("subject-title").textContent = subject;

            const blocksContainer = document.getElementById("blocks-container");
            blocksContainer.innerHTML = "";

            for (const block in db[subject]) {
                const btn = document.createElement("button");
                btn.className = "btn btn-outline";
                btn.style.color = "var(--text)";
                btn.style.borderColor = "var(--text-muted)";
                btn.onmouseover = function() { this.style.backgroundColor = "var(--text-muted)"; this.style.color = "var(--bg)"; }
                btn.onmouseout = function() { this.style.backgroundColor = "transparent"; this.style.color = "var(--text)"; }
                btn.textContent = `${block} (${db[subject][block].length} pregs.)`;
                btn.onclick = () => startTest(block);
                blocksContainer.appendChild(btn);
            }
        }

        function showSubjects() {
            document.getElementById("blocks-area").style.display = "none";
            document.getElementById("quiz-area").style.display = "none";
            document.getElementById("result-area").style.display = "none";
            document.getElementById("subject-area").style.display = "block";
        }

        function returnToBlocks() {
            document.getElementById("quiz-area").style.display = "none";
            document.getElementById("result-area").style.display = "none";
            document.getElementById("blocks-area").style.display = "block";
        }

        function updateLiveScore() {
            let correctScore = 0;
            let errorScore = 0;
            for (let i = 0; i < currentQuestionList.length; i++) {
                if (userAnswers[i] !== undefined) {
                    if (userAnswers[i] === currentQuestionList[i].correcta) { 
                        correctScore++; 
                    } else {
                        errorScore++;
                    }
                }
            }
            document.getElementById("live-score").textContent = `Aciertos: ${correctScore}`;
            document.getElementById("live-errors").textContent = `Fallos: ${errorScore}`;
        }

        function restartBlock() {
            startTest(currentBlock);
        }

        function startTest(block) {
            currentBlock = block;
            currentQuestionList = db[currentSubject][block];
            currentIndex = 0;
            userAnswers = []; 
            
            document.getElementById("blocks-area").style.display = "none";
            document.getElementById("result-area").style.display = "none";
            document.getElementById("quiz-area").style.display = "flex";
            
            updateLiveScore();
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            document.getElementById("prev-btn").style.display = currentIndex > 0 ? "block" : "none";
            
            const nextBtn = document.getElementById("next-btn");
            nextBtn.style.display = "block";
            nextBtn.textContent = (currentIndex === currentQuestionList.length - 1) ? "Finalizar" : "Siguiente";

            const feedbackBox = document.getElementById("feedback-box");
            feedbackBox.classList.remove("show"); 
            
            const q = currentQuestionList[currentIndex];
            
            document.getElementById("progress-text").textContent = `${currentBlock} | Pregunta ${currentIndex + 1} de ${currentQuestionList.length}`;
            document.getElementById("question-text").textContent = q.enunciado;
            
            const optContainer = document.getElementById("options-container");
            optContainer.innerHTML = "";
            
            q.opciones.forEach((textoOp, i) => {
                const optDiv = document.createElement("div");
                optDiv.className = "option";
                optDiv.textContent = textoOp;
                optDiv.onclick = () => checkAnswer(i, optDiv);
                optContainer.appendChild(optDiv);
            });

            if (userAnswers[currentIndex] !== undefined) {
                checkAnswer(userAnswers[currentIndex], optContainer.children[userAnswers[currentIndex]], true);
            }
        }

        function checkAnswer(selectedIndex, clickedDiv, isHistory = false) {
            if (answered) return;
            answered = true; 
            
            if (!isHistory) {
                userAnswers[currentIndex] = selectedIndex;
                updateLiveScore();
            }

            const q = currentQuestionList[currentIndex];
            const optDivs = document.getElementById("options-container").children;
            const feedbackBox = document.getElementById("feedback-box");
            
            for (let i = 0; i < optDivs.length; i++) {
                optDivs[i].classList.add("disabled");
                if (i === q.correcta) {
                    optDivs[i].classList.add("correct");
                }
            }

            let feedbackHTML = "";
            if (selectedIndex === q.correcta) {
                feedbackHTML += `<div class="feedback-header">¡Acertaste! 🎉</div>`;
                feedbackHTML += `<div class="feedback-subtitle">A continuación tienes el desglose de todas las opciones para repasar:</div>`;
                feedbackBox.className = "feedback feedback-correct show";
            } else {
                clickedDiv.classList.add("incorrect");
                feedbackHTML += `<div class="feedback-header">¡Fallaste! ❌</div>`;
                feedbackHTML += `<div class="feedback-subtitle">A continuación tienes el desglose de todas las opciones para repasar:</div>`;
                feedbackBox.className = "feedback feedback-incorrect show";
            }

            // ... (resto de tu código de checkAnswer por arriba) ...

            feedbackHTML += `<ul class="feedback-list">`;
            q.opciones.forEach((texto, i) => {
                let icono = (i === q.correcta) ? "✅" : "❌";
                let tuEleccion = (i === selectedIndex) ? " <em>(Tu respuesta)</em>" : "";
                
                let textoSeguro = texto.replaceAll("<", "&lt;").replaceAll(">", "&gt;");
                
                let feedbackOriginal = q.feedback[i] || ""; 
                let feedbackSeguro = feedbackOriginal.replaceAll("<", "&lt;").replaceAll(">", "&gt;");
                
                // 3. Metemos las dos variables seguras en el HTML
                feedbackHTML += `<li>
                    <div class="feedback-title">${icono} ${textoSeguro} <span style="font-weight: normal; opacity: 0.8;">${tuEleccion}</span></div>
                    <div class="feedback-desc">${feedbackSeguro}</div>
                </li>`;
            });
            feedbackHTML += `</ul>`;

            feedbackBox.innerHTML = feedbackHTML;
            document.getElementById("restart-btn").style.display = "block";
        }

        function prevQuestion() {
            if (currentIndex > 0) { currentIndex--; loadQuestion(); }
        }

        function nextQuestion() {
            if (currentIndex < currentQuestionList.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            let score = 0;
            let errors = 0;
            let penalty = 0;
            
            for (let i = 0; i < currentQuestionList.length; i++) {
                if (userAnswers[i] !== undefined) {
                    if (userAnswers[i] === currentQuestionList[i].correcta) { 
                        score++; 
                    } else {
                        errors++;
                        if (currentQuestionList[i].opciones.length === 4) {
                            penalty += (1 / 3);
                        }
                    }
                }
            }

            let netScore = score - penalty;
            if (netScore < 0) netScore = 0; 
            
            let gradeOutOf10 = (netScore / currentQuestionList.length) * 10;
            gradeOutOf10 = gradeOutOf10.toFixed(2); 

            document.getElementById("quiz-area").style.display = "none";
            document.getElementById("result-area").style.display = "block";
            
            let resultHTML = `Has acertado <strong style="color:var(--primary)">${score}</strong> de <strong>${currentQuestionList.length}</strong> preguntas.<br>`;
            
            if (penalty > 0) {
                 resultHTML += `<span style="font-size: 0.7em; color: var(--text-muted); display: block; margin-top: 10px;">(Penalización aplicada: -${penalty.toFixed(2)} puntos por fallos en preguntas de 4 opciones)</span><br><br>`;
            } else {
                 resultHTML += `<br><br>`;
            }
            
            let colorNota = gradeOutOf10 >= 5 ? "var(--success)" : "var(--error)";
            resultHTML += `Nota final: <strong style="color:${colorNota}; font-size: 1.5em; display:block; margin-top: 10px;">${gradeOutOf10} / 10</strong>`;
            
            document.getElementById("final-score").innerHTML = resultHTML;
        }

        init();
    </script>
